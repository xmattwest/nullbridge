[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nullbridge"
version = "0.1.0"
description = "Zero-FLOP null-space alignment and latent de-biasing inside recurrent transformer loop bridges."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "xmattwest" },
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
ndif = [
    "nnsight>=0.8.3",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
nullbridge = "nullbridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nullbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
