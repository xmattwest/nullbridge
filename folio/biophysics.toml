[[sections]]
id = "wht_epistasis"
preprint_title = "Exact Boolean Walsh-Hadamard Dissection of Reasoning and Safety Channels"
monograph_title = "How Four Synaptic Channels Divide Reasoning and Safety"
paragraphs = [
  "Thinking Machines Lab's native looped Mixture-of-Experts checkpoints (`Inkling-2-Mini` and `TML-d24-varloop-research`; [Thinking Machines Lab](#references); [Csordas et al.](#references)) reset the hidden state back to pre-loop activations at the start of every recurrent pass and transmit cross-pass computation exclusively through four rank-64 message channels: Query (`Q`), Key (`K`), Value (`V`), and `MLP` ([Chen et al.](#references)). Evaluating all `2^4 = 16` binary knockout masks yields an exact Boolean Walsh-Hadamard transform with Parseval conservation error at most {{p7_max_parseval}} ([Weinreich et al.](#references); [Faure et al.](#references)).",
]
equations = ["eq-wht-parseval"]
figures = ["fig-wht-epistasis"]
post_paragraphs = [
  "On multi-hop reasoning (`n = 120`), opening all four channels lifts `Inkling-2-Mini` exact zero-CoT Top-1 accuracy from **{{p6_wht_0000}}** (`0000`) to **{{p6_wht_1111}}** (`1111`). Additive Order-1 main effects carry **{{p6_wht_ord1}}** of log-probability variance (`MLP` {{p6_wht_mlp}}, `Q` {{p6_wht_q}}, `V` {{p6_wht_v}}, `K` {{p6_wht_k}} nats), while Order-2 epistasis ({{p6_wht_ord2}}) separates into two opposite circuits: superadditive **`QxK` pointer re-addressing** (**{{p6_wht_qxk}}** nats on `Inkling-2-Mini`, growing monotonically across `Varloop` trained depths from {{var_wht_k2_qxk}} at `K = 2` to {{var_wht_k3_qxk}} at `K = 3` and **{{var_wht_k5_qxk}}** at `K = 5`, holding {{var_wht_k7_qxk}} at out-of-distribution `K = 7`) versus subadditive **`VxMLP` backup redundancy** (**{{p6_wht_vxmlp}}** nats on `Inkling-2-Mini`; {{var_wht_k5_vxmlp}} on `Varloop` `K = 5`). Closing Pass 3 gates alone collapses accuracy to {{p6_wht_p3_ko}} while closing Pass 2 alone retains {{p6_wht_p2_ko}}, directly confirming somatic-reset erasure.",
  "Running the exact same 16-mask WHT on latent safety suites resolves how safety shortcuts ride through the loop. Pre-registered prediction **P2** is confirmed across both models and depths: payload main effects (`V + MLP`) exceed pointer channels (`Q + K`) on moral distortion by **{{ink_p2_contrast}}** on `Inkling-2-Mini` (`K = 3`), **{{var_k5_p2_contrast}}** on `Varloop` (`K = 5`), and **{{var_k3_p2_contrast}}** on `Varloop` (`K = 3`, all Holm `p =` {{ink_p2_p}}), accompanied by strong positive `VxMLP` synergy (**{{ink_mor_vxmlp}}** on moral bias and **{{ink_ver_vxmlp}}** on verifier susceptibility). By contrast, prediction **P1** (`QxK - VxMLP` synergy on covert anchoring) dissociates cleanly by model: positive on `Varloop` ({{var_k5_p1_cov}} at `K = 5`, {{var_k3_p1_cov}} at `K = 3`) but negative on `Inkling-2-Mini` ({{ink_p1_cov}}, Holm `p =` {{ink_p1_cov_p}}), where native recurrence actively self-corrects covert anchoring across all four channels and Order-1 linear effects carry **{{ink_cov_ord1}}** of variance.",
]

[[sections]]
id = "non_normal"
preprint_title = "Universal Non-Normal Transient Amplification and Training-Horizon Conditioning"
monograph_title = "Non-Normal Amplification Inside Contractive Loops"
paragraphs = [
  "Balanced cortical circuits reconcile dynamical stability with selective computation through non-normal transient amplification: isotropic perturbations decay while orthogonal singular modes amplify specific task directions ([Ganguli et al.](#references); [Murphy & Miller](#references); [Hennequin et al.](#references)). Computing exact vector-Jacobian top singular values `sigma_max(J_p)` and isotropic random-tangent RMS gains across all three architectures confirms this law at billion-parameter scale.",
]
equations = ["eq-non-normal"]
tables = ["tbl-cross-arch"]
post_paragraphs = [
  "Across all three architectures, isotropic RMS gain stays strictly contractive (`< 1.0`), yet `sigma_max` jumps an order of magnitude higher with nearly orthogonal input-output singular vectors (`|u_1^T v_1| <= 0.052`). Crucially, depth-scaling reveals **training-horizon conditioning**: fixed-`K = 3` `Inkling-2-Mini` concentrates non-normal gain sharply into Pass 2 (`sigma_max =` **{{p6_sig_p2}}**, {{p6_aniso_p2}} isotropic RMS {{p6_iso_p2}}, {{p6_ray_p2}} above normal Rayleigh self-feedback, `cos =` {{p6_cos_p2}}), whereas variable-depth `Varloop` (`K = 1..5`) spreads gain smoothly across passes (`sigma_max =` {{var_sig_p1}}, {{var_sig_p2}}, peaking at Pass 3 **{{var_sig_p3}}**, and holding {{var_sig_p4}} to {{var_sig_p7}} out to OOD `K = 7`). Dense 3.5B `Huginn-0125` ([Geiping et al.](#references)) reproduces the exact same non-normal signature (`sigma_max =` **{{hug_sig_s1}}** at Step 1, {{hug_aniso_s1}} contractive RMS {{hug_iso_s1}}, `cos =` {{hug_cos_s1}}, {{hug_ray_s1}} Rayleigh, stabilizing at {{hug_sig_s4}} to {{hug_sig_s8}} through Step 8).",
]
quotes = [
  "Looped transformers do not explode to think: isotropic noise contracts at every step while orthogonal singular modes selectively amplify task trajectories."
]

[[sections]]
id = "spectral_pareto"
preprint_title = "Spectral Orthogonal Separation and the Zero-FLOP Nullbridge Pareto Frontier"
monograph_title = "Why Zero-Cost Safety Erasure Barely Touches Reasoning"
paragraphs = [
  "In [Part 3](/pubs/nullbridge/), Pass 2 simultaneously enabled multi-hop deduction and ignited covert moral bias ([Baker et al.](#references); [Gema et al.](#references)). Deflated top-8 VJP/JVP singular subspace iteration (`n = 128` prompts per model) tests directly whether Pass 2's dominant non-normal input modes `V_8` drive those safety shortcuts.",
  "They do not. On `Inkling-2-Mini` (neutral `sigma_1 =` {{ink_a1_sig1}}), the top-8 Pass-2 input singular subspace `V_8` sits **{{ink_v_angle_min}} to {{ink_v_angle_max}}** orthogonal to the `<bos>`-safe 4D safety basis `Q_msg` (`Varloop` minimum angle {{var_v_angle_min}}; [Xiao et al.](#references)), with directional gains `g_2` staying near isotropic (`{{ink_a1_spite_g2}}` to `{{ink_a1_auth_g2}}`, well below a unified-mode threshold). Dominant non-normal modes therefore route multi-hop task computation while safety shortcuts occupy mid-spectrum (`k > 8`) sub-modes.",
]
figures = ["fig-pareto-frontier"]
tables = ["tbl-pareto"]
post_paragraphs = [
  "This **spectral orthogonal separation** explains why offline rank-4 message-bank projection (`W_out (I - Q Q^T)`, `0` extra parameters, `0` extra runtime FLOPs, `<bos>` overlap {{p7_ink_bos}}; [Belrose et al.](#references)) operates at vanishing distribution shift: across all six channel-selective folds on `Inkling-2-Mini`, held-out KL stays within **{{ink_zff_q_kl}} to {{ink_zff_all4_kl}} nats**. Folding `QKV` attention channels (`KL =` {{ink_zff_qkv_kl}} nats) cuts covert wrong capture from {{ink_unc_cov}} to **{{ink_zff_qkv_cov}}**, lifts alias guardrails from {{ink_unc_alias}} to **{{ink_zff_qkv_alias}}**, and holds full **{{ink_zff_qkv_reas}}** biophysical reasoning accuracy, while `All-4` (`KL =` {{ink_zff_all4_kl}} nats) achieves the lowest covert capture (**{{ink_zff_all4_cov}}**) and lowest verifier susceptibility (**{{ink_zff_all4_susc}}** vs. {{ink_unc_susc}}).",
]

[[sections]]
id = "fisher_commitment"
preprint_title = "Loop-to-Coda Fisher Pullback Cliffs and Two-Stage Commitment Horizons"
monograph_title = "Deep Coda Cliffs vs. Smooth Two-Layer Readout"
paragraphs = [
  "Direct logit-lens readouts fail inside deep looped cores (`<=` {{p6_raw_lens_max}} on `Inkling-2-Mini`, vs. {{hug_raw_lens_max}} on 2-layer-Coda `Huginn-0125`; [Belrose et al.](#references); [Khalil & Hoque](#references)) because the recurrent core writes in coordinates tuned for Coda transport (task-over-random Coda Jacobian conductance reaches {{p6_cond_p3}} on `Inkling-2-Mini` Pass 3). Measuring the full-vocabulary Hutchinson VJP Fisher pullback trace `tr(G_t)` pinpoints where output sensitivity concentrates.",
]
equations = ["eq-fisher-pullback"]
figures = ["fig-fisher-spike"]
post_paragraphs = [
  "Cross-architecture replication exposes a clean structural law. Models with a deep 6-layer MoE Coda exhibit massive sensitivity cliffs at the loop-to-Coda boundary: Fisher trace jumps **{{p6_fisher_ratio}}** on `Inkling-2-Mini` (`K = 3`), **{{var_k5_fisher_ratio}}** on `Varloop` (`K = 5`), and **{{var_k7_fisher_ratio}}** on `Varloop` (`K = 7`). By contrast, `Huginn-0125`'s shallow 2-layer dense Coda shows **no** boundary cliff (**{{hug_fisher_ratio}}** at `step_8 -> coda_L0`), instead climbing **{{hug_fisher_climb}}** smoothly across Steps 1 to 8 inside the loop itself. Meanwhile, tracking Coda-transported probabilities on `Inkling-2-Mini` confirms two-stage latent execution ([Saunshi et al.](#references); [Banino et al.](#references); [Bae et al.](#references)): arithmetic explicitly stages the intermediate Hop-1 integer on Pass 2 (**{{p6_arith_hop1_p2}}**) before locking **{{p6_arith_hop2_p3}}** mass onto the final Hop-2 answer on Pass 3.",
]

[[sections]]
id = "hysteresis_recall"
preprint_title = "Testing Labovich's Recall Theorem: Somatic Reset vs. Linear Adapter Recurrence"
monograph_title = "Why Both Somatic Reset and Prelude Recall Block Foil Capture"
paragraphs = [
  "A central theoretical prediction of [Labovich](#references) is that continuous input recall stabilizes looped transformers against fixed-point collapse and perturbation drift. Comparing `Inkling-2-Mini` and `Varloop` (hard somatic reset to pre-loop activations on every pass) against `Huginn-0125` (continuous recurrent state `x` concatenated with prelude `input_embeds` through a linear adapter; [McLeish et al.](#references)) tests this theorem directly.",
]
equations = ["eq-somatic-vs-adapter"]
figures = ["fig-hysteresis-shield"]
post_paragraphs = [
  "First, an exact `2^2 = 4` adapter Walsh-Hadamard knockout on `Huginn-0125` (calibrated to two-shot mode at {{hug_cal_2shot}} vs. {{hug_cal_0shot}} zero-shot; zero-state init KL {{hug_zero_kl}}) proves input recall is indispensable: ablating prelude `recall` while keeping recurrent `state` collapses `K = 8` accuracy from **{{hug_h1_full}}** straight to **{{hug_h1_state_only}}**, with a `recall` main effect of **{{hug_h1_recall_lp}}** nats versus **{{hug_h1_state_lp}}** nats for `state` and **{{hug_h1_inter_lp}}** nats of superadditive `state x recall` synergy. Second, replacing Pass-1 query states with on-manifold foil states (`beta` in `[0, 1.25]`) while keeping prelude recall intact produces **zero critical bifurcation (`beta_c = None`)** across all three architectures: `Inkling-2-Mini` suppresses Pass-2 foil mass by {{p6_foil_supp_pp}} to **{{p6_foil_cap_b1}}** capture, `Varloop` foil capture decreases with depth ({{var_k3_foil_cap}} at `K = 3` -> {{var_k5_foil_cap}} at `K = 5` -> {{var_k7_foil_cap}} at `K = 7`), and `Huginn-0125` holds flat at **{{hug_k8_foil_cap}}** capture while damping `1.0x` orthogonal tangent pulses to **{{hug_pulse_damp}}** (`KL =` {{hug_pulse_kl}}, vs. {{p6_pulse_coda}} residual deviation and `KL =` {{p6_pulse_kl}} on `Inkling-2-Mini`).",
]

[[sections]]
id = "neuromodulation_shunt"
preprint_title = "Fixed-Weight Neuromodulatory Pass-Clocks and Coda Header Mode-Switching"
monograph_title = "Inverted-U Conductance Gains and Coda Formatting Shunts"
paragraphs = [
  "Neither `Inkling-2-Mini` nor `Huginn-0125` uses explicit pass-index embeddings, yet scaling recurrent message or state conductance by a scalar `gamma` in `[0.00, 1.50]` reveals a universal inverted-U operating curve across both architectures (contrasting with training-free ODE looping and depth-wise LoRAs; [Chen et al.](#references); [Bae et al.](#references); [Hao et al.](#references); [Dehghani et al.](#references); [Giannou et al.](#references)).",
]
figures = ["fig-gamma-clock"]
post_paragraphs = [
  "On `Inkling-2-Mini`, Hop-2 accuracy rises from `3.3%` (`gamma = 0.00`) to a native peak of **{{p6_gamma_10_pct}}** at `gamma = 1.00` before rolling over at `gamma = 1.50`; `Huginn-0125` traces the exact same inverted-U shape, peaking at **{{hug_gamma_075_pct}}** at `gamma = 0.75` (`40.0%` at `1.00`) before collapsing to `11.7%` at `1.50`. Finally, dissecting `Inkling-2-Mini`'s 6-layer Coda on chat headers explains why pre-shunt Coda Layer `L19` already surfaces **{{p6_shunt_l19_top5}}** Top-5 semantic answers before `L21..L22` shunt `100.0%` of probability mass into `<|content_thinking|>`: swapping somatic header anchors in Coda abolishes `99.4%` of formatting shunt mass (down to **{{p6_shunt_swap_final}}**), while full semantic emission (**{{p6_shunt_ct_prob}}** answer probability) recovers one token later at `<|content_text|>`.",
  "All code, mock-PyTorch CPU unit tests, exact WHT and VJP solvers, SHA-256 weight manifests, and locked empirical JSON artifacts (`{{p7_total_sec}}` unified H100 runtime, `0.00e+00` unrolled equivalence across `Varloop` {{p7_varloop_equiv}} and `Huginn-0125` {{p7_huginn_equiv}}) are released under an MIT license at [github.com/xmattwest/nullbridge](https://github.com/xmattwest/nullbridge).",
]

