abstract = "When a looped transformer runs its middle layers three to eight times silently before writing a word, direct vocabulary probes miss {{p6_raw_lens_miss}} of answers inside the loop, never clearing {{p6_raw_lens_max}} accuracy across thirty-six recurrent layer visits on Inkling-2-Mini. Yet passing the final loop state through the six-layer Coda at the exit decodes {{p6_coda_p3_acc}} zero-CoT accuracy. To see how silent recurrence actually computes, I applied cortical circuit diagnostics across three open recurrent-depth language models (thinkingmachines/Inkling-2-Mini at K = 3, variable-depth thinkingmachines/TML-d24-varloop-research across K = 1..7, and dense continuous-state tomg-group-umd/huginn-0125 across K = 1..8, with bit-exact unrolled equivalence {{p7_varloop_equiv}}). Knocking out all sixteen Boolean combinations of the four cross-pass message gates (Parseval error at most {{p7_max_parseval}}) lifts Inkling-2-Mini multi-hop accuracy from {{p6_wht_0000}} with all gates closed to {{p6_wht_1111}} with all four open. Additive main effects carry {{p6_wht_ord1}} of log-probability variance, while pairwise interactions split into a superadditive Query-Key coincidence trigger ({{p6_wht_qxk}} nats on Inkling-2-Mini and {{var_wht_k5_qxk}} nats on Varloop K = 5) and redundant Value-MLP backup tracts ({{p6_wht_vxmlp}} nats). Moral valuation bias rides primarily on Value and MLP payload gates across both checkpoints ({{ink_p2_contrast}} log-odds contrast over Query and Key on Inkling-2-Mini and {{var_k5_p2_contrast}} on Varloop K = 5, Holm p = {{ink_p2_p}}), whereas native recurrence on Inkling-2-Mini actively self-corrects covert numeric anchoring. Across all three architectures, vector-Jacobian singular modes reveal balanced non-normal amplification: random perturbations shrink every pass ({{p6_iso_p1}} to {{hug_iso_s1}} isotropic RMS), while task-aligned singular modes surge to {{p6_sig_p2}} on Inkling-2-Mini Pass 2 ({{p6_aniso_p2}} above random noise, input-output cosine {{p6_cos_p2}}), {{var_sig_p3}} on Varloop Pass 3, and {{hug_sig_s1}} on Huginn-0125 Step 1. Because Pass 2's top eight input modes sit {{ink_v_angle_min}} to {{ink_v_angle_max}} perpendicular to the four-dimensional safety subspace, folding a rank-four erasure directly into the message gates trims covert wrong capture at {{ink_zff_q_kl}} to {{ink_zff_all4_kl}} nats held-out KL with zero runtime cost. Finally, Fisher curvature jumps {{p6_fisher_ratio}} to {{var_k5_fisher_ratio}} at the entry to six-layer Codas where two-layer Huginn-0125 reads out gradually inside the loop ({{hug_fisher_ratio}} boundary ratio), and cutting prompt recall collapses Huginn-0125 accuracy to {{hug_h1_state_only}} while intact recall or somatic resets block foil capture across an inverted-U conductance window."

lede = "Across Inkling-2-Mini, variable-depth Varloop, and dense Huginn-0125, silent recurrent loops damp random perturbations every pass ({{p6_iso_p1}} to {{hug_iso_s1}} RMS) while amplifying task signals up to {{p6_sig_p2_ratio}} into nearly perpendicular directions. Mapping all sixteen synaptic gate knockouts and Pass-2 singular modes shows why six-layer exit blocks create {{p6_fisher_ratio}} to {{var_k5_fisher_ratio}} readout cliffs and why zero-cost safety erasure leaves reasoning intact below {{ink_zff_all4_kl}} nats KL."

x_hook = "Standard word probes miss {{p6_raw_lens_miss}} of answers inside Inkling-2-Mini's silent thinking loop, yet the six-layer exit block decodes {{p6_coda_p3_acc}} accuracy without a single chain-of-thought token. I ran cortical circuit tests across Inkling-2-Mini, Varloop, and Huginn-0125 and found the same trick balanced brains use to think without self-oscillating: every pass damps random static while firing task signals up to {{p6_sig_p2_ratio}} into orthogonal modes."

opening_paragraphs = [
  "When a looped transformer runs its middle layers three to eight times silently before writing a word, standard logit lenses miss **{{p6_raw_lens_miss}}** of answers. Across thirty-six recurrent layer visits inside `Inkling-2-Mini`, direct vocabulary readouts never clear **{{p6_raw_lens_max}}** accuracy, yet handing the final loop state to the six-layer Coda at the exit recovers **{{p6_coda_p3_acc}}** zero-CoT accuracy.",
  "Static layer-stack probes fail there for a simple reason. They assume every layer writes in surface word coordinates, whereas a weight-sharing loop is a feedback circuit that has to think several steps ahead without blowing up or blurting out a half-finished guess.",
  "Treating the loop like a living cortical circuit makes the machinery legible (Ganguli et al., 2008; Murphy & Miller, 2009; Hennequin et al., 2014). I ran the same circuit diagnostics across `thinkingmachines/Inkling-2-Mini` (`K = 3`), variable-depth `thinkingmachines/TML-d24-varloop-research` (`K = 1..7`), and dense `tomg-group-umd/huginn-0125` (`K = 1..8`). All three damp random noise every pass while slinging task signals sideways, and that geometry explains why zero-cost safety erasure leaves reasoning intact below {{ink_zff_all4_kl}} nats KL.",
]

