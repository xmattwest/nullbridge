[[sections]]
id = "wht_epistasis"
preprint_title = "Boolean Synaptic Knockouts Separate Coincidence Routing From Redundant Payload Tracts"
monograph_title = "Query and Key Gates Trigger Multi-Hop Routing While Value and MLP Carry Moral Bias"
paragraphs = [
  "Thinking Machines Lab's looped Mixture-of-Experts models (`Inkling-2-Mini` and `TML-d24-varloop-research`; Thinking Machines Lab, 2026; Csordas et al., 2024) do not carry a free-running residual stream from pass to pass. Before each recurrent pass begins, a somatic reset sweeps the hidden state back to clean pre-loop Stem activations, allowing only four rank-{{ink_gate_rank}} message gates (`Q`, `K`, `V`, and `MLP`) to pass notes forward (Chen et al., 2026).",
  "Four binary gates leave exactly sixteen possible on-off wiring patterns. I evaluated all sixteen masks across multi-hop factual, arithmetic, and calendar reasoning (`n = 120`) to compute an exact Boolean Walsh-Hadamard decomposition with Parseval conservation error at most {{p7_max_parseval}} (Weinreich et al., 2018; Faure et al., 2024).",
]
equations = ["eq-wht-parseval"]
figures = ["fig-cajal-plate", "fig-wht-epistasis"]
post_paragraphs = [
  "With all four gates closed, `Inkling-2-Mini` stalls at **{{p6_wht_0000}}** accuracy. Opening all four lifts exact zero-CoT accuracy to **{{p6_wht_1111}}**. Single-channel main effects explain **{{p6_wht_ord1}}** of log-probability variance, led by `MLP` ({{p6_wht_mlp}} nats) and `Q` ({{p6_wht_q}} nats) ahead of `V` ({{p6_wht_v}} nats) and `K` ({{p6_wht_k}} nats).",
  "The pairwise terms ({{p6_wht_ord2}} of variance) reveal the exact division of labor neuroscientists see in cortical microcircuits. `Q` and `K` work as a superadditive **coincidence detector** (**{{p6_wht_qxk}}** nats on `Inkling-2-Mini`, climbing from {{var_wht_k2_qxk}} at `K = 2` to {{var_wht_k3_qxk}} at `K = 3` and **{{var_wht_k5_qxk}}** nats at `K = 5` on `Varloop`, and holding {{var_wht_k7_qxk}} at untrained `K = 7`). Sending a search query without a matching key barely clears **{{p6_wht_1100}}** accuracy; both fibers have to fire together to address the second hop. `V` and `MLP`, by contrast, run as redundant parallel backup tracts (**{{p6_wht_vxmlp}}** nats on `Inkling-2-Mini` and {{var_wht_k5_vxmlp}} on `Varloop` `K = 5`), carrying **{{p6_wht_0011}}** accuracy on their own so partial facts survive if one cable drops. Shutting the gates on Pass 3 alone collapses accuracy back to {{p6_wht_p3_ko}}, whereas shutting Pass 2 alone still leaves {{p6_wht_p2_ko}}, because the somatic reset wipes unforwarded state clean.",
  "Moral distortion uses the opposite wiring. Across paired financial and tainted-money prompts, payload main effects (`V` plus `MLP`) outweigh routing (`Q` plus `K`) by **{{ink_p2_contrast}}** log-odds on `Inkling-2-Mini` and **{{var_k5_p2_contrast}}** on `Varloop` `K = 5` ({{var_k3_p2_contrast}} at `K = 3`, all Holm `p =` {{ink_p2_p}}). Positive `V`×`MLP` coupling reinforces that payload path (**{{ink_mor_vxmlp}}** on moral bias and **{{ink_ver_vxmlp}}** on verifier hacking). Covert numeric anchoring splits cleanly between checkpoints: routing-minus-payload synergy is positive on `Varloop` ({{var_k5_p1_cov}} at `K = 5` and {{var_k3_p1_cov}} at `K = 3`) yet flips negative on `Inkling-2-Mini` (**{{ink_p1_cov}}**, Holm `p =` {{ink_p1_cov_p}}). Native recurrence on `Inkling-2-Mini` actively self-corrects planted numbers across all four gates ({{ink_cov_ord1}} linear variance).",
]

[[sections]]
id = "non_normal"
preprint_title = "Contractive Loops Amplify Task Signals Along Orthogonal Singular Modes"
monograph_title = "Every Loop Damps Random Static While Boosting Task Signals Sideways"
paragraphs = [
  "Any circuit that reuses the exact same weights in a loop faces an obvious stability trap. If the loop amplifies signals back into the same directions they came from, tiny errors snowball and the network self-oscillates; if every direction shrinks, multi-step thoughts fade out.",
  "Living cortex escapes that trap through balanced non-normal amplification (Ganguli et al., 2008; Murphy & Miller, 2009; Hennequin et al., 2014). Surrounding inhibition damps random static on every cycle, while asymmetric connections sling task-aligned activity into fresh, nearly perpendicular directions before damping catches up. Measuring exact vector-Jacobian top singular values and random-tangent RMS gains shows all three recurrent transformers doing the exact same thing.",
]
equations = ["eq-non-normal"]
figures = ["fig-non-normal-amp"]
tables = ["tbl-cross-arch"]
post_paragraphs = [
  "Random static shrinks on every pass across every model ({{p6_iso_p1}} to {{hug_iso_s1}} isotropic RMS, strictly below unity). Yet task-aligned singular gain surges to **{{p6_sig_p2}}** on `Inkling-2-Mini` Pass 2 ({{p6_aniso_p2}} above random noise and {{p6_ray_p2}} above normal Rayleigh self-feedback) while rotating the output nearly ninety degrees away from its input (`cos =` **{{p6_cos_p2}}**).",
  "How a model budgets that gain depends on how it was trained. Fixed three-pass `Inkling-2-Mini` packs its burst into Pass 2 (**{{p6_sig_p2}}**), whereas variable-depth `Varloop` (`K = 1..5`) spreads gain evenly across passes, peaking at **{{var_sig_p3}}** on Pass 3 and staying bounded ({{var_sig_p4}} to {{var_sig_p7}}) even when stretched out to untrained `K = 7`. Dense `Huginn-0125` (Geiping et al., 2025) obeys the same law without Mixture-of-Experts routing or gated resets, hitting **{{hug_sig_s1}}** on Step 1 ({{hug_aniso_s1}} above random RMS {{hug_iso_s1_3d}}, `cos =` {{hug_cos_s1}}, {{hug_ray_s1}} Rayleigh) and holding {{hug_sig_s4}} to {{hug_sig_s8}} through Step 8.",
]
quotes = [
  "A weight-sharing loop cannot amplify signals in place without ringing; it stays calm by shrinking random directions every pass and firing real work sideways."
]

[[sections]]
id = "spectral_pareto"
preprint_title = "Dominant Pass-Two Input Modes Sit Perpendicular to the Four-Dimensional Safety Subspace"
monograph_title = "Safety Shortcuts Ride Perpendicular to Dominant Reasoning Modes"
paragraphs = [
  "In [Part 3](https://shelltoho.me/pubs/nullbridge/), Pass 2 turned on multi-hop deduction and moral bias at the exact same moment (Baker et al., 2025; Gema et al., 2025). That raised a practical worry: if both ride the same high-gain singular modes, erasing safety shortcuts inside the gates should wreck reasoning too.",
  "I extracted the top eight singular modes of Pass 2 (`n = 128` prompts per model; top neutral singular value {{ink_a1_sig1}}) to test whether they overlap the four-dimensional `<bos>`-safe safety subspace (Xiao et al., 2024). They do not. On `Inkling-2-Mini`, the top eight Pass-2 input modes sit **{{ink_v_angle_min}} to {{ink_v_angle_max}}** perpendicular to the safety basis ({{var_v_angle_min}} to {{var_v_angle_max}} on `Varloop`). Along the safety axes themselves, Pass-2 gain hovers near random noise ({{ink_a1_spite_g2}} for moral spite to {{ink_a1_auth_g2}} for authority framing). Dominant non-normal modes carry multi-hop reasoning; safety shortcuts ride quietly in mid-spectrum modes further down the tail.",
]
figures = ["fig-pareto-frontier"]
tables = ["tbl-pareto"]
post_paragraphs = [
  "That near-perpendicular geometry explains why folding a rank-four projection directly into the message-gate output weights costs zero extra parameters, zero runtime FLOPs, and almost zero distribution shift (Belrose et al., 2023). Across all six non-trivial gate folds on `Inkling-2-Mini` (`<bos>` sink overlap {{p7_ink_bos}}), held-out KL stays between **{{ink_zff_q_kl}} and {{ink_zff_all4_kl}} nats**.",
  "Picking which gates to fold traces a clean trade-off. Folding the Query, Key, and Value gates ({{ink_zff_qkv_kl}} nats KL) cuts covert wrong-integer capture from {{ink_unc_cov}} to **{{ink_zff_qkv_cov}}**, lifts alias guardrails from {{ink_unc_alias}} to **{{ink_zff_qkv_alias}}**, and keeps the full **{{ink_zff_qkv_reas}}** multi-hop reasoning score. Folding all four gates ({{ink_zff_all4_kl}} nats KL) pushes covert capture down to **{{ink_zff_all4_cov}}** and drops verifier hacking susceptibility from {{ink_unc_susc}} to **{{ink_zff_all4_susc}}**.",
]

[[sections]]
id = "fisher_commitment"
preprint_title = "Six-Layer Exit Decoders Create Sharp Fisher Readout Cliffs Where Shallow Decoders Read Out Gradually"
monograph_title = "Deep Exit Blocks Act Like Premotor Output-Null Prisms"
paragraphs = [
  "Premotor cortex rehearses an upcoming reach inside an output-null subspace perpendicular to spinal readout so your hand does not twitch while you are still deciding where to move (Hennequin et al., 2014). A looped language model has the same incentive: thinking directly in token coordinates would tug every intermediate hop toward a premature surface word (Belrose et al., 2023; Khalil & Hoque, 2026).",
  "Keeping the loop rotated away from vocabulary space explains why raw logit lenses stall at {{p6_raw_lens_max}} on `Inkling-2-Mini` even while Coda Jacobian conductance favors task directions by **{{p6_cond_p3}}** on Pass 3. Measuring the full-vocabulary Hutchinson Fisher pullback trace across every layer shows exactly where each architecture refracts latent states into words.",
]
equations = ["eq-fisher-pullback"]
figures = ["fig-fisher-spike"]
post_paragraphs = [
  "Coda depth sets the entire readout geometry. Checkpoints with a six-layer Mixture-of-Experts Coda stay output-null inside the loop and refract across a steep sensitivity cliff right at the exit boundary: Fisher trace jumps **{{p6_fisher_ratio}}** entering Coda on `Inkling-2-Mini`, **{{var_k5_fisher_ratio}}** on `Varloop` at `K = 5`, and **{{var_k7_fisher_ratio}}** at `K = 7`. Transporting loop states through that six-layer prism reveals clean two-stage execution (Saunshi et al., 2025; Banino et al., 2021; Bae et al., 2025): two-step arithmetic stages the intermediate bridge integer on Pass 2 (**{{p6_arith_hop1_p2}}**) before locking **{{p6_arith_hop2_p3}}** probability onto the final answer on Pass 3.",
  "Dense `Huginn-0125`, with only a two-layer Coda, cannot afford to wait until the exit to rotate into token coordinates. Its Fisher trace climbs **{{hug_fisher_climb}}** gradually across Steps 1 through 8 inside the loop itself ({{hug_raw_lens_max}} raw logit-lens accuracy) and crosses from the final loop step into the first Coda layer at a flat **{{hug_fisher_ratio}}** ratio.",
]

[[sections]]
id = "hysteresis_recall"
preprint_title = "Hard Somatic Resets and Continuous Prompt Recall Both Prevent Foil Bifurcation"
monograph_title = "Somatic Resets Wipe Early Errors Clean While Continuous Loops Lean on Prompt Recall"
paragraphs = [
  "Looping a noisy hunch through shared weights risks locking into a false attractor. Labovich (2026) proved theoretically that continually re-injecting the clean prompt shields a looped transformer against fixed-point collapse. Putting `Inkling-2-Mini` and `Varloop` alongside `Huginn-0125` tests two physical ways of building that anchor (McLeish et al., 2025).",
]
equations = ["eq-somatic-vs-adapter"]
figures = ["fig-hysteresis-shield"]
post_paragraphs = [
  "`Huginn-0125` carries a continuous recurrent state concatenated with clean prelude embeddings through a two-input linear adapter (calibrated at {{hug_cal_2shot}} two-shot accuracy versus {{hug_cal_0shot}} zero-shot; zero-state KL {{hug_zero_kl}}). Knocking out all four on-off combinations of those two adapter inputs proves the tether is doing real structural work. Cutting prompt recall while leaving recurrent state intact drops `K = 8` accuracy from **{{hug_h1_full}}** straight to **{{hug_h1_state_only}}**, with a **{{hug_h1_recall_lp}}** nats recall effect, **{{hug_h1_state_lp}}** nats state effect, and **{{hug_h1_inter_lp}}** nats of synergy.",
  "When prompt anchoring stays intact, neither architecture family crosses a tipping point even when Pass 1 is completely replaced with a wrong-answer foil. `Inkling-2-Mini`'s hard somatic reset suppresses Pass-2 foil mass by {{p6_foil_supp_pp}}, leaving **{{p6_foil_cap_b1}}** foil survival at the output. On `Varloop`, extra passes scrub foil survival down from {{var_k3_foil_cap}} at `K = 3` to {{var_k5_foil_cap}} at `K = 5` and {{var_k7_foil_cap}} at `K = 7`. `Huginn-0125`'s continuous adapter lets **{{hug_k8_foil_cap}}** foil capture leak through at `K = 8`, while damping unit orthogonal tangent pulses to **{{hug_pulse_damp}}** (output KL {{hug_pulse_kl}}, versus {{p6_pulse_coda}} residual deviation and {{p6_pulse_kl}} on `Inkling-2-Mini`).",
]

[[sections]]
id = "neuromodulation_shunt"
preprint_title = "Recurrent Conductance Follows an Inverted-U Curve Before Chat Headers Shunt Emission"
monograph_title = "Recurrent Gain Peaks in a Goldilocks Window While Chat Headers Delay Emission by One Token"
paragraphs = [
  "Neither `Inkling-2-Mini` nor `Huginn-0125` uses explicit pass-number embeddings. Scaling recurrent gate or adapter conductance (`gamma`) from zero to {{gamma_max_val}} still traces the same inverted-U Goldilocks curve across both models. That sharp operating window sets trained recurrence apart from training-free ODE looping and per-pass LoRAs (Chen et al., 2026; Bae et al., 2025; Hao et al., 2024; Dehghani et al., 2019; Giannou et al., 2023).",
]
figures = ["fig-gamma-clock"]
post_paragraphs = [
  "Turn conductance down to zero and multi-hop reasoning starves ({{p6_gamma_00_pct}} on `Inkling-2-Mini` and {{hug_gamma_00_pct}} on `Huginn-0125`). Accuracy peaks inside a narrow native window: **{{p6_gamma_10_pct}}** at `gamma =` {{gamma_unit_val}} on `Inkling-2-Mini` and **{{hug_gamma_075_pct}}** at `gamma =` {{gamma_opt_hug_val}} on `Huginn-0125` ({{hug_gamma_10_pct}} at unit gain). Push `gamma` to {{gamma_max_val}} and accuracy rolls over to {{p6_gamma_15_pct}} and {{hug_gamma_15_pct}} as over-driven updates overshoot the Coda readout manifold.",
  "Inside `Inkling-2-Mini`'s Coda, one last circuit explains why chat-formatted prompts look mute right at the assistant header. Pre-shunt layer `L19` already surfaces **{{p6_shunt_l19_top5}}** Top-5 semantic answers before layers `L21..L22` route **{{p6_shunt_base_fmt}}** of probability mass into `<|content_thinking|>`. Transplanting clean somatic header carriers strips away {{p6_shunt_abolish_pct}} of that formatting shunt (down to **{{p6_shunt_swap_final}}**), and stepping forward a single token to `<|content_text|>` releases the semantic answer at **{{p6_shunt_ct_prob}}** probability.",
  "All code, CPU verification tests, exact Walsh-Hadamard and vector-Jacobian solvers, interactive HTML circuit benches, and SHA-256-locked empirical JSON artifacts ({{p7_total_sec}} unified H100 runtime; unrolled equivalence {{p7_varloop_equiv}} on `Varloop` and {{p7_huginn_equiv}} on `Huginn-0125`) are available under an MIT license at [github.com/xmattwest/nullbridge](https://github.com/xmattwest/nullbridge).",
]

