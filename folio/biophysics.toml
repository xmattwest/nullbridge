abstract = "Recurrent-depth language models execute multi-step reasoning inside fixed weights without emitting chain-of-thought tokens, yet standard direct-unembedding probes stall below {{p6_raw_lens_max}} accuracy across 36 loop visits. Importing exact dynamical-systems and systems-neuroscience diagnostics onto three open recurrent-depth architectures (`thinkingmachines/Inkling-2-Mini` at `K = 3`, variable-depth `thinkingmachines/TML-d24-varloop-research` across `K = 1..7`, and dense continuous-state `tomg-group-umd/huginn-0125` across `K = 1..8`; bit-exact unrolled equivalence `0.00e+00` across all models), I establish four biophysical laws of latent recurrence and test their causal link to latent safety failures. First, exact `2^4 = 16` Boolean Walsh-Hadamard synaptic knockouts (Parseval error <= {{p7_max_parseval}}) show that opening all four cross-pass message channels lifts `Inkling-2-Mini` multi-hop accuracy from {{p6_wht_0000}} to {{p6_wht_1111}}, partitioning variance into {{p6_wht_ord1}} Order-1 main effects plus opposite-sign Order-2 circuits: superadditive `QxK` pointer synergy ({{p6_wht_qxk}} nats on `Inkling-2-Mini`, climbing to {{var_wht_k5_qxk}} nats on `Varloop` `K = 5`) versus redundant `VxMLP` payload backup ({{p6_wht_vxmlp}} nats). On latent safety suites, pre-registered prediction P2 is confirmed across both models (`V + MLP` exceeds `Q + K` on moral distortion by {{ink_p2_contrast}} on `Inkling-2-Mini` and {{var_k5_p2_contrast}} on `Varloop` `K = 5`, Holm `p =` {{ink_p2_p}}), while prediction P1 dissociates by model because native recurrence actively self-corrects covert anchoring on `Inkling-2-Mini`. Second, exact VJP singular-value iteration proves universal non-normal transient amplification inside contractive dynamics: isotropic random-tangent RMS gain stays below `1.0` across all three architectures (`0.17` to `0.73`), while top singular gain `sigma_max` reaches {{p6_sig_p2}} on `Inkling-2-Mini` Pass 2 ({{p6_aniso_p2}} isotropic, I/O `cos =` {{p6_cos_p2}}), {{var_sig_p3}} on `Varloop` Pass 3 (training-horizon conditioning), and {{hug_sig_s1}} on dense `Huginn-0125` Step 1 ({{hug_aniso_s1}} isotropic). Third, deflated top-8 singular alignment reveals spectral orthogonal separation: Pass-2 input singular modes `V_8` sit {{ink_v_angle_min}} to {{ink_v_angle_max}} from the 4D safety subspace `Q_msg`, explaining why channel-selective zero-FLOP Nullbridge folding trims covert wrong-capture at {{ink_zff_qkv_kl}} to {{ink_zff_all4_kl}} nats held-out KL with `0` extra parameters or FLOPs. Fourth, Hutchinson VJP Fisher pullback exposes an architectural Coda contrast: 6-layer MoE Codas trigger {{p6_fisher_ratio}} (`Inkling-2-Mini`) and {{var_k5_fisher_ratio}} (`Varloop` `K = 5`) loop-to-Coda sensitivity cliffs, whereas 2-layer dense `Huginn-0125` climbs smoothly inside the loop ({{hug_fisher_climb}}) with a {{hug_fisher_ratio}} Coda handoff. Finally, Pass-1 foil perturbations and 2-channel adapter knockouts confirm Labovich's general recall theorem: ablating prelude recall collapses `Huginn-0125` accuracy to {{hug_h1_state_only}}, while intact recall or hard somatic reset prevents foil bifurcation (`beta_c = None`) across all three architectures and yields universal inverted-U conductance curves peaking at native gain."

lede = "Across Inkling-2-Mini (K = 3), variable-depth Varloop (K = 1..7), and dense Huginn-0125 (K = 1..8), recurrent-depth transformers pair contractive isotropic dynamics with {{var_sig_p2}}x to {{p6_sig_p2}}x non-normal singular amplification, partition reasoning into superadditive QxK pointers versus redundant VxMLP payloads, keep safety subspaces orthogonal to dominant Pass-2 input modes (enabling <= {{ink_zff_all4_kl}} nats zero-FLOP erasure), and prevent foil bifurcation via somatic reset or linear prelude recall."

x_hook = "How does a looped transformer think without writing tokens? Dissected Inkling-2-Mini, Varloop (K=1..7), and Huginn-0125 (K=1..8) with exact 16-mask Walsh-Hadamard knockouts, VJP singular modes, Fisher pullback cliffs, and foil hysteresis. Non-normal amplification is universal, safety rides orthogonal to Pass-2 input modes, and 6-layer Codas create 88x-142x readout cliffs."

opening_paragraphs = [
  "When a recurrent-depth transformer runs its middle layers three to eight times before emitting a single word, direct logit-lens probes stay nearly blind, never clearing **{{p6_raw_lens_max}}** accuracy across 36 recurrent layer visits on `Inkling-2-Mini`. Yet passing the final loop exit through the six-layer Coda unlocks **{{p6_coda_p3_acc}}** exact zero-CoT accuracy.",
  "Understanding what happens inside that dark recurrent core requires tools built for feedback systems rather than feedforward stacks: exact Boolean Walsh-Hadamard knockouts across synaptic channels, vector-Jacobian singular-mode geometry, Hutchinson Fisher pullback curvature, and foil-interpolation hysteresis tests ([Ganguli et al.](#references); [Murphy & Miller](#references); [Labovich](#references)).",
  "Applying this biophysical battery across three open architectures (`thinkingmachines/Inkling-2-Mini`, `thinkingmachines/TML-d24-varloop-research` across `K = 1..7`, and dense `tomg-group-umd/huginn-0125` across `K = 1..8`) uncovers universal non-normal transient amplification inside contractive dynamics, sharp architectural contrasts between 6-layer and 2-layer Codas, and the geometric reason zero-FLOP Nullbridge erases latent safety biases at less than two millinats of KL cost.",
]

