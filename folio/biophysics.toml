# ---------------------------------------------------------------------------
# Equations (4 Core Biophysical Formalisms)
# ---------------------------------------------------------------------------

[[equations]]
id = "eq-wht-parseval"
label = "(1)"
latex = 'f(m) = \sum_{S \subseteq \{Q,K,V,M\}} \hat{w}_S \prod_{i \in S} (-1)^{1 - m_i}, \qquad \mathrm{Var}_{m}[f(m)] = \sum_{S \neq \emptyset} \hat{w}_S^2'
unicode = "f(m) = sum_{S subset {Q,K,V,M}} w_S prod_{i in S} (-1)^(1 - m_i),   Var[f(m)] = sum_{S != empty} w_S^2"

[[equations]]
id = "eq-non-normal"
label = "(2)"
latex = '\sigma_{\max}(J_p) = \max_{\|v\|_2 = 1} \|J_p v\|_2 \gg \rho_{\mathrm{Rayleigh}}(J_p) = |v_1^\top J_p v_1| = \sigma_1 |u_1^\top v_1|, \qquad \mathrm{RMS}_{\mathrm{iso}}(J_p) = \sqrt{\frac{1}{d}\mathrm{tr}(J_p^\top J_p)} < 1'
unicode = "sigma_max(J_p) = max ||J_p v||_2 >> |v_1^T J_p v_1| = sigma_1 |u_1^T v_1|,   RMS_iso(J_p) = sqrt(tr(J_p^T J_p)/d) < 1"

[[equations]]
id = "eq-fisher-pullback"
label = "(3)"
latex = 'G_t = J_t^\top \left(\mathrm{diag}(p) - p p^\top\right) J_t, \qquad \mathrm{tr}(G_t) = \mathbb{E}_{z \sim \mathcal{N}(0, I)}\!\left[\left\|J_t^\top \left(\mathrm{diag}(p) - p p^\top\right)^{1/2} z\right\|_2^2\right]'
unicode = "G_t = J_t^T (diag(p) - p p^T) J_t,   tr(G_t) = E[ || J_t^T (diag(p) - p p^T)^(1/2) z ||_2^2 ]"

[[equations]]
id = "eq-somatic-vs-adapter"
label = "(4)"
latex = 'h^{(p)}_{\mathrm{in}} = (1 - f_g)\,\odot\, h_{\mathrm{pre}} + m_g \odot M\!\left(h^{(p-1)}\right) \quad \text{(Inkling/Varloop)} \qquad \text{vs.} \qquad x^{(p)} = F_{\mathrm{core}}\!\left(W_{\mathrm{adp}}\!\left[x^{(p-1)};\, e_{\mathrm{pre}}\right]\right) \quad \text{(Huginn)}'
unicode = "h_in^(p) = (1 - f_g) * h_pre + m_g * M(h^(p-1))  [Inkling/Varloop]   vs.   x^(p) = F_core(W_adp [x^(p-1); e_pre])  [Huginn]"

