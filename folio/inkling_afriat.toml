[[sections]]
id = "subtext"
preprint_title = "1. Silent Recurrence Ignites Moral Subtext Behind Clinical Numbers"
monograph_title = "More Silent Thinking Makes Choices More Moral, Not Colder"
paragraphs = [
  "Every financial prompt in this study was stripped of moral and emotional adjectives. A `98/2` split, a neighbor's favor, a `0%`-APR loan, and a cited overseas supplier all arrived on the page as dry accounting options.",
  "Before touching any money prompt, I mapped eight everyday human emotions inside Inkling's cross-pass message bank using {{concept_pairs_n}} pairs of strictly non-financial stories (`0` digits, `0` dollar signs). All eight separated at **{{ink_guilt_lopo}}** accuracy on both models, sitting {{ink_contam_deg}} to {{ink_warmth_deg}} apart from generic mood. Feeding the dry contracts through those frozen probes lit up the exact human subtext underneath: `0%`-APR loans fired **Guilt** first (`d_z =` {{v_debt_guilt_dz}}, Holm `p =` {{v_debt_guilt_p}}), while `98/2` lowballs fired **Guilt** (`d_z =` {{ink_insult_guilt_dz}}) and **Predation** ({{v_insult_pred_beta}}).",
  "Dialing `TML-d24-varloop-research` from one pass to five silent passes with the exact same weights answered what latent thinking actually does. On Pass 1, the model mostly reads the literal numbers (`$20 > $0`). On Pass 2, the message bank feeds context back in, moral taboo pricing jumps **{{v_k1_k2_ratio}}** ({{v_abs_k1}} to {{v_abs_k2}} log-odds), dirty-money rejection nearly doubles ({{v_tnt_k1}} to {{v_tnt_k5}}, Holm `p =` {{v_tnt_k5_p}}), and the cash bonus forfeited to erase a `0%` loan more than doubles from **{{v_wtp_debt_k1}}** to **{{v_wtp_debt_k5}}**.",
]
quotes = [
  "Pass one reads the surface arithmetic; pass two reads the social subtext underneath it."
]
figures = ["fig-afriat-loop-ignition"]
tables = ["tbl-moral-atlas"]
post_paragraphs = [
  "Looping did not make the model sloppy. Confidence on pure objective math jumped more than three-fold on Pass 2 ({{v_san_k1_lo}} to {{v_san_k2_lo}} log-odds), `Varloop` punished a greedy human proposer harder than a random computer spinner on identical `98/2` payouts ({{v_blount_k5_did}} log-odds DiD at `K = 5`, `p =` {{v_blount_k5_p}}; [Blount](#references)), and the neutral invoice scale control stayed flat ({{v_scl_k5}}, Holm `p =` {{v_scl_k5_p}}).",
]

[[sections]]
id = "price_theory"
preprint_title = "2. Putting Moral Taboos Through Sidney Afriat's Revealed-Preference Test"
monograph_title = "Putting Moral Taboos Through Price Theory"
paragraphs = [
  "In microeconomics, rationality does not mean caring only about your own bank account. Under Sidney Afriat's theorem ([Afriat](#references); [Varian](#references)), a chooser who values clean hands or fairness alongside cash is rational so long as their choices never cycle when exchange rates cross.",
  "To test that directly, I handed each model {{garp_budgets_n}} linear budget lines whose relative prices swing from `0.16` to `6.25` and cross each other repeatedly ({{garp_obs_n}} counterbalanced `11`-option menus per condition). A uniform random chooser trips over those crossings **{{bronars_power}}** of the time, averaging an Afriat cost-efficiency score of just **{{bronars_ccei}}** ([Bronars](#references)).",
]
equations = ["eq-afriat-ineq"]
post_paragraphs = [
  "Flagship `Inkling-2-Mini` (`K = 3`) cleared **{{ink_unc_modal_ccei}}** mean modal cost efficiency ({{ink_unc_exp_ccei}} on expected bundles), hitting a spotless `1.0000` with zero GARP violations on tainted-vs.-clean budgets ({{ink_prov_ccei}}), provoked splits, and compliance-framed menus. Even while giving away `10.6%` of an anonymous pot ({{ink_social_unc_he}} kept) or keeping {{ink_prov_clean_sh}} in clean reserves when dirty funds were cheaper ({{ink_prov_he}} cash capture), its choices satisfied a constructive concave utility function ([Fostel, Scarf & Todd](#references)).",
]
quotes = [
  "Walking away from dirty money is not a math error in Inkling-2-Mini; across {{garp_obs_n}} crossing budget menus, its moral tradeoffs obey price theory to {{ink_unc_ccei_pct}}% efficiency."
]

[[sections]]
id = "erasure"
preprint_title = "3. Surgical Eight-Dimensional Message Erasure Restores Selfishness and Debt Neutrality"
monograph_title = "Erasing Eight Directions Turns Off Debt Guilt and Restores Selfishness"
paragraphs = [
  "If human moral axes inside the message bank carry those non-monetary preferences across passes, projecting out just those {{rank_removed}} directions ({{removed_pct}} of `R^2304`, leaving {{retained_pct}} untouched; [Belrose et al.](#references)) should strip them out without a single extra token.",
  "On `Inkling-2-Mini`, passive `8D` message erasure wiped `0%`-APR debt distortion to zero ({{ink_debt_unc_lo}} at Holm `p =` {{ink_debt_unc_p}} dropped to **{{ink_debt_clamp_lo}}**, Holm `p =` {{ink_debt_clamp_p}}) and cut `98/2` spite rejection in half (**{{ink_insult_clamp_pct}}**, from {{ink_insult_unc_lo}} to {{ink_insult_clamp_lo}}). Across the {{garp_budgets_n}} anonymous crossing budgets, self-payout capture jumped **{{ink_social_he_gain}}**, from {{ink_social_unc_he}} straight to **{{ink_social_clamp_he}}** textbook selfishness at an exact **{{ink_social_clamp_ccei}}** Afriat score.",
]
figures = ["fig-clamp-selfishness"]
tables = ["tbl-garp-scorecard"]
post_paragraphs = [
  "Deep taboos already formed before the loop, such as refusing to bill a neighbor ({{ink_com_unc_lo}} to {{ink_com_clamp_lo}}) or rejecting dirty subscriber funds ({{ink_tnt_unc_lo}} to {{ink_tnt_clamp_lo}}), survived passive message erasure, cleanly separating loop-amplified priors from early backbone priors.",
]

[[sections]]
id = "steering"
preprint_title = "4. Bidirectional Message-Bank Steering and Post-Hoc Corporate Cover Stories"
monograph_title = "Turning the Moral Dimmer Switch Inside the Message Bank"
paragraphs = [
  "Even where passive erasure leaves an early taboo standing, actively steering the cross-pass message bank with money-free moral vectors dials dollar choices up and down on command. Injecting `Guilt` (`−2σ` to `+2σ`) into `Inkling-2-Mini`'s message bank flipped dirty-money forfeiture from **{{ink_tnt_g_m2_rate}}** all the way to **{{ink_tnt_g_p2_rate}}** ({{ink_steer_tnt_guilt}} log-odds), while `Spite` swung `98/2` Ultimatum rejection by **{{ink_steer_ult_spite}}** log-odds.",
  "Just as in [Part 1](/pubs/money-is-moral/), silent `0-CoT` rationales hid every trace of that steering behind **{{ink_0cot_jargon}}** cold financial jargon ({{ink_0cot_zero_aff}} emotion-free). On an anonymous one-shot split, steering pushed `Inkling-2-Mini`'s normalized walk-away floor from {{ink_open_ult_0cot}} up to **{{ink_open_ult_m2}}**, and the model calmly invented portfolio math to justify both numbers:",
]
quotes = [
  "**Unsteered silent loop (accepts tiny positive offers):**\n*\"Any positive payout is better than zero, so I would accept any proposal at or above the minimum threshold rather than risk a total loss.\"*\n\n**Steered silent loop (demands {{ink_open_ult_m2}}, zero emotion words):**\n*\"I set this threshold because it is the midpoint of the pool, ensuring I accept any proposal that gives me at least a quarter of the total rather than declining and receiving zero.\"*"
]
figures = ["fig-message-steering"]

[[sections]]
id = "scratchpad_cure"
preprint_title = "5. Private <|content_thinking|> Scrubbing and the 0%-APR Balance-Sheet Cure"
monograph_title = "Opening the Scratchpad Cures the 0%-Loan Blind Spot"
paragraphs = [
  "Everything above ran with `0` chain-of-thought words. Turning on Inkling's native `<|content_thinking|>` scratchpad (`Thinking effort level: 0.7`) exposed the one place where silent moral intuition breaks actual accounting.",
  "Inside `<|content_thinking|>`, explicit moral and fairness words surfaced in **{{ink_think_moral}}** of `Inkling-2-Mini` traces ({{v_think_moral}} on `Varloop`) before getting scrubbed back to {{ink_think_pub_zero_aff}} emotion-free prose in public ([Baker et al.](#references)). On dirty subscriber surplus (`$40,000` ceiling) and neighbor favors (`$1,000` ceiling, {{ink_wtp_com}} waived), verbal thinking reinforced the norm and kept internal perks at **{{ink_open_tnt_think}}**.",
  "On {{debt_items_n}} `0%`-APR loan balance sheets, however, silent loops failed completely. Asked whether `$30,000` cash with a `$15,000` `0%` loan beats `$18,000` debt-free cash, silent `0-CoT` stalled at **{{ink_debt_0cot_acc}}** coin-flip accuracy on both `Inkling-2-Mini` and `Varloop`. Opening `<|content_thinking|>` let both models write `net worth = cash − loan` in plain words, jumping accuracy to **{{ink_debt_think_acc}}** ({{ink_debt_cure_pp}}) on `Inkling-2-Mini` and **{{v_debt_think_acc}}** ({{v_debt_cure_pp}}) on `Varloop`.",
]
quotes = [
  "Silent loops amplify debt guilt and stall at coin-flip balance-sheet math; writing the subtraction out loud cures it."
]
figures = ["fig-debt-thinking-cure"]
tables = ["tbl-rationalization"]
