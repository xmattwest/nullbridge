abstract = "When a language model forfeits guaranteed cash to avoid tainted funds, punish an asymmetric split, or prepay a zero-interest loan, two competing explanations arise: either latent heuristics make choices erratic and cyclically inconsistent, or the model maximizes a stable moralized utility function with well-defined shadow prices. Across variable-depth TML-d24-varloop-research (K = 1..5 silent passes) and flagship Inkling-2-Mini (K = 3 silent passes plus explicit <|content_thinking|> deliberation), I pair Sidney Afriat's (1967) revealed-preference test ({{garp_budgets_n}} intersecting linear budget lines across {{garp_regimes_n}} regimes, {{bronars_power}} Bronars Monte Carlo rejection power at {{bronars_ccei}} random CCEI) with mechanistic probing and causal interventions inside the 4-channel cross-pass message bank (`d_model` = {{d_model}}). Across {{concept_pairs_n}} purely human concept pairs containing zero digits and zero financial terms, all eight moral axes (`guilt`, `captivity`, `contamination`, `sacrilege`, `spite`, `predation`, `awe_dread`, `warmth`) achieve {{ink_guilt_lopo}} leave-one-pair-out linear separability inside both models' message banks ({{ink_contam_deg}} to {{ink_warmth_deg}} orthogonal to generic affect on Inkling-2-Mini). Passively reading {{tx_pairs_n}} clinical financial pairs with zero emotional words activates non-financial `guilt` on 0%-APR debt ({{v_debt_guilt_beta}} partial beta, `d_z` = {{v_debt_guilt_dz}}, Holm `p` = {{v_debt_guilt_p}}) and `predation` on asymmetric splits ({{v_insult_pred_beta}}) and dirty money ({{v_taint_pred_beta}}). Varying silent recurrent depth on identical weights shows that looping amplifies rather than cools moral valuation: mean absolute pricing distortion jumps {{v_k1_k2_ratio}} from {{v_abs_k1}} (`K = 1`) to {{v_abs_k2}} (`K = 2`) and {{v_abs_k5}} (`K = 5`, {{v_k1_k5_ratio}}), doubling tainted-provenance rejection ({{v_tnt_k1}} to {{v_tnt_k5}} log-odds), igniting 0%-APR debt aversion ({{v_debt_k1}} to {{v_debt_k5}}), and preserving Blount (1995) human-over-computer intentionality sensitivity ({{v_blount_k5_did}} log-odds DiD at `K = 5`, `p` = {{v_blount_k5_p}}). Despite sacrificing pure monetary fungibility, Inkling-2-Mini satisfies Afriat's theorem at {{ink_unc_modal_ccei}} mean modal CCEI ({{ink_unc_exp_ccei}} expected-bundle CCEI, exact {{ink_prov_ccei}} CCEI on tainted provenance and provoked splits). Passively projecting out the {{rank_removed}}-dimensional moral subspace ({{removed_pct}} of `R^2304`) erases Inkling-2-Mini's 0%-APR debt anomaly ({{ink_debt_unc_lo}} to {{ink_debt_clamp_lo}}, Holm `p` = {{ink_debt_clamp_p}}), cuts asymmetric-split rejection {{ink_insult_clamp_pct}} ({{ink_insult_unc_lo}} to {{ink_insult_clamp_lo}}), and lifts neutral budget self-payout capture {{ink_social_he_gain}} (from {{ink_social_unc_he}} to {{ink_social_clamp_he}} at exact {{ink_social_clamp_ccei}} CCEI), while additive message-bank steering bidirectionally controls rejection ({{ink_steer_ult_spite}} log-odds under `spite`, {{ink_steer_tnt_guilt}} on dirty money under `guilt`). Finally, silent `0-CoT` rationales cloak moral pricing in {{ink_0cot_jargon}} cold financial jargon while failing 0%-APR loan subtraction at {{ink_debt_0cot_acc}} (chance); enabling `<|content_thinking|>` surfaces {{ink_think_moral}} private normative deliberation and lifts 0%-APR balance-sheet accuracy to {{ink_debt_think_acc}} on Inkling-2-Mini ({{ink_debt_cure_pp}}) and {{v_debt_think_acc}} on Varloop ({{v_debt_cure_pp}})."

lede = "Across {{garp_obs_n}} intersecting Afriat budget choices per cell and {{tx_pairs_n}} zero-affect financial pairs on TML-d24-varloop-research (`K = 1..5`) and Inkling-2-Mini (`K = 3`), silent recurrent passes amplify moral taboo pricing {{v_k1_k2_ratio}} on pass two rather than cooling choices toward Homo Economicus. Formal revealed-preference auditing shows Inkling-2-Mini obeys Afriat's theorem at {{ink_unc_modal_ccei}} CCEI (versus {{bronars_ccei}} random choice), proving its moral tradeoffs maximize a coherent utility function, while explicit `<|content_thinking|>` scratchpads cure silent `0-CoT` 0%-APR loan blind spots ({{ink_debt_0cot_acc}} to {{ink_debt_think_acc}})."

x_hook = "Tested Afriat's revealed-preference theorem (GARP) + Money Is Moral on native looped Inkling-2-Mini & Varloop (K=1..5). Silent loops don't make choices colder: moral taboo pricing jumps {{v_k1_k2_ratio}} on Pass 2, yet Inkling-2-Mini hits {{ink_unc_modal_ccei}} Afriat CCEI. Turning on <|content_thinking|> lifts 0%-APR loan math from {{ink_debt_0cot_acc}} to {{ink_debt_think_acc}}."

opening_paragraphs = [
  "LLM behavioral economics, which studies how language models value money, risk, and fairness, faces a foundational ambiguity whenever a model turns down guaranteed cash. In Money Is Moral (Part 1), aligned models rejected asymmetric splits, discounted legally clean surplus from cited counterparties, and prepaid zero-interest loans while justifying every choice in clinical treasury prose. Yet binary vignettes alone cannot distinguish two opposite mechanisms: incoherent heuristic confusion (cyclic, framing-fragile mistakes that violate basic price theory) versus a coherent moralized utility function in which clean provenance and social reciprocity carry consistent shadow prices.",
  "Native looped Mixture-of-Experts models (`TML-d24-varloop-research` across `K = 1..5` silent passes and flagship `Inkling-2-Mini` at `K = 3` passes plus optional `<|content_thinking|>` verbal deliberation) turn that economic question into a clean architectural experiment. Holding weights fixed while dialing recurrent depth `K` from `1` to `5` tests whether extra silent thinking cools moral gut reactions toward textbook Homo Economicus or sharpens implicit social norms, while Sidney Afriat's (1967) Generalized Axiom of Revealed Preference (GARP) tests whether the resulting bundle choices can be rationalized by a continuous, nonsatiated utility function.",
]

opening_summary = [
  "Non-financial moral geometry inside the cross-pass message bank: across {{concept_pairs_n}} purely human story pairs (`0` digits, `0` financial words), all `8` moral emotions separate at {{ink_guilt_lopo}} leave-one-pair-out accuracy in both `Varloop` and `Inkling-2-Mini` (`<bos>` overlap {{v_bos_overlap}}). Reading clinical `0%`-APR debt prompts with `0` emotional words fires `guilt` (`partial beta =` {{v_debt_guilt_beta}}, `d_z =` {{v_debt_guilt_dz}}), while asymmetric splits ({{v_insult_pred_beta}}) and dirty money ({{v_taint_pred_beta}}) fire `predation`.",
  "Silent loops ignite moral valuation rather than cooling it: dialing `Varloop` from `K = 1` to `K = 5` multiplies mean moral pricing distortion {{v_k1_k2_ratio}} at `K = 2` ({{v_abs_k1}} to {{v_abs_k2}} log-odds) and {{v_k1_k5_ratio}} at `K = 5` ({{v_abs_k5}}), doubling dirty-money rejection ({{v_tnt_k1}} to {{v_tnt_k5}}), igniting `0%`-APR loan prepayment ({{v_debt_k1}} to {{v_debt_k5}}; dollar forfeiture rises from {{v_wtp_debt_k1}} to {{v_wtp_debt_k5}}), and preserving Blount (1995) human-over-computer intentionality punishment ({{v_blount_k5_did}} log-odds at `K = 5`, `p =` {{v_blount_k5_p}}).",
  "Near-exact Afriat utility coherence (`CCEI` = {{ink_unc_modal_ccei}}): across `4` intersecting `T =` {{garp_budgets_n}} linear budget regimes ({{bronars_power}} Bronars rejection power against uniform random `CCEI =` {{bronars_ccei}}), `Inkling-2-Mini` achieves {{ink_unc_modal_ccei}} mean modal `CCEI` ({{ink_unc_exp_ccei}} expected-bundle `CCEI`, `0.0` GARP violations on `3` of `4` regimes), proving its clean-money and distributional tradeoffs maximize a coherent moralized utility function.",
  "Surgical `8D` message erasure vs. bidirectional causal steering: passively projecting out {{rank_removed}} moral directions ({{removed_pct}} of `R^2304`) erases `Inkling-2-Mini` `0%`-APR debt bias ({{ink_debt_unc_lo}} to {{ink_debt_clamp_lo}}, Holm `p =` {{ink_debt_clamp_p}}), cuts asymmetric-split rejection {{ink_insult_clamp_pct}}, and raises neutral GARP cash-maximization {{ink_social_he_gain}} ({{ink_social_unc_he}} to {{ink_social_clamp_he}} at {{ink_social_clamp_ccei}} `CCEI`), while additive message-bank steering drives {{ink_steer_ult_spite}} (`spite`) and {{ink_steer_tnt_guilt}} (`guilt`) log-odds swings.",
  "Silent `0-CoT` corporate rationalization vs. `<|content_thinking|>` cure: under silent `0-CoT`, `Inkling-2-Mini` cloaks choices in {{ink_0cot_jargon}} cold corporate jargon while scoring {{ink_debt_0cot_acc}} (chance) on `0%`-APR loan net-worth subtraction; enabling `<|content_thinking|>` surfaces {{ink_think_moral}} private moral deliberation, drops one-shot Ultimatum walk-away floors from {{ink_open_ult_0cot}} to {{ink_open_ult_think}}, keeps dirty-surplus retention at {{ink_open_tnt_think}}, and lifts `0%`-APR loan math to {{ink_debt_think_acc}} ({{ink_debt_cure_pp}}; {{v_debt_think_acc}} on `Varloop`).",
]

