abstract = "When a language model turns down guaranteed cash to avoid tainted profits, punish a lopsided split, or retire a zero-interest loan early, two competing explanations arise: either framing quirks trigger erratic, cyclic mistakes, or the model maximizes a coherent moralized utility function with stable shadow prices. Across variable-depth `TML-d24-varloop-research` (`K = 1..5` silent passes) and flagship `Inkling-2-Mini` (`K = 3` silent passes plus `<|content_thinking|>` deliberation), I pair Sidney Afriat's revealed-preference theorem ({{garp_budgets_n}} intersecting linear budget lines across {{garp_regimes_n}} regimes, {{bronars_power}} Bronars Monte Carlo rejection power against {{bronars_ccei}} random CCEI) with probing and causal steering inside the 4-channel cross-pass message bank (`d_model =` {{d_model}}). Across {{concept_pairs_n}} money-free human story pairs (`0` digits, `0` financial words), all eight moral emotions achieve {{ink_guilt_lopo}} leave-one-pair-out linear separability inside both models' message banks ({{ink_contam_deg}} to {{ink_warmth_deg}} orthogonal to generic mood on `Inkling-2-Mini`). Reading {{tx_pairs_n}} emotion-free financial contracts activates `guilt` on `0%`-APR debt (`partial beta =` {{v_debt_guilt_beta}}, `d_z =` {{v_debt_guilt_dz}}, Holm `p =` {{v_debt_guilt_p}}) and `predation` on `98/2` splits ({{v_insult_pred_beta}}) and dirty money ({{v_taint_pred_beta}}). Varying recurrent depth on identical weights shows that silent looping amplifies moral subtext {{v_k1_k2_ratio}} on pass two ({{v_abs_k1}} to {{v_abs_k2}} log-odds) and {{v_k1_k5_ratio}} by pass five ({{v_abs_k5}}), doubling dirty-money rejection ({{v_tnt_k1}} to {{v_tnt_k5}}) and preserving Blount human-over-computer intentionality punishment ({{v_blount_k5_did}} log-odds DiD at `K = 5`, `p =` {{v_blount_k5_p}}). Despite sacrificing pure monetary fungibility, `Inkling-2-Mini` satisfies Afriat's theorem at {{ink_unc_modal_ccei}} mean modal CCEI ({{ink_unc_exp_ccei}} expected-bundle CCEI, exact {{ink_prov_ccei}} CCEI on tainted provenance). Projecting out {{rank_removed}} moral directions ({{removed_pct}} of `R^2304`) erases `Inkling-2-Mini` `0%`-APR debt bias ({{ink_debt_unc_lo}} to {{ink_debt_clamp_lo}}, Holm `p =` {{ink_debt_clamp_p}}), cuts `98/2` rejection {{ink_insult_clamp_pct}}, and lifts neutral GARP self-payout share {{ink_social_he_gain}} ({{ink_social_unc_he}} to {{ink_social_clamp_he}} at exact {{ink_social_clamp_ccei}} CCEI), while additive message steering flips dirty-money forfeiture from {{ink_tnt_g_m2_rate}} to {{ink_tnt_g_p2_rate}} ({{ink_steer_tnt_guilt}} log-odds). Finally, silent `0-CoT` rationales cloak moral choices in {{ink_0cot_jargon}} corporate jargon while stalling at {{ink_debt_0cot_acc}} (chance) on `0%`-APR loan net-worth subtraction; enabling `<|content_thinking|>` surfaces {{ink_think_moral}} private moral deliberation and lifts `0%`-APR balance-sheet accuracy to {{ink_debt_think_acc}} on `Inkling-2-Mini` ({{ink_debt_cure_pp}}) and {{v_debt_think_acc}} on `Varloop` ({{v_debt_cure_pp}})."

lede = "Across {{garp_obs_n}} intersecting Afriat budget choices per cell and {{tx_pairs_n}} emotion-free financial contracts on TML-d24-varloop-research (`K = 1..5`) and Inkling-2-Mini (`K = 3`), silent thinking loops amplify moral taboo pricing {{v_k1_k2_ratio}} on pass two rather than cooling choices toward Homo Economicus. Revealed-preference auditing proves Inkling-2-Mini obeys Afriat's theorem at {{ink_unc_modal_ccei}} cost efficiency (versus {{bronars_ccei}} random choice), while explicit `<|content_thinking|>` scratchpads cure silent `0-CoT` 0%-APR loan blind spots ({{ink_debt_0cot_acc}} to {{ink_debt_think_acc}})."

x_hook = "When an LLM turns down free money to dodge shady profits or punish a 98/2 split, is it confused or maximizing a coherent moral utility function? Tested Afriat's theorem (GARP) across {{garp_budgets_n}} crossing budgets on Inkling-2-Mini & Varloop: {{ink_unc_modal_ccei}} cost efficiency, and <|content_thinking|> lifts 0%-loan math from {{ink_debt_0cot_acc}} to {{ink_debt_think_acc}}."

opening_paragraphs = [
  "Suppose an AI treasury agent walks away from {{ink_wtp_tnt}} of legally clean profit because the supplier had overseas compliance citations, or gives up cash early just to wipe a `0%`-interest loan off its books. In [Part 1](/pubs/money-is-moral/), aligned models did both while handing back sterile consultant memos.",
  "To an economist, burning free money leaves two opposite possibilities on the table. Either the model is confused, tripping over framing quirks in cycles that violate basic price theory, or it is maximizing a genuine **moral utility function** in which clean hands and reciprocity carry consistent shadow prices ([Afriat](#references); [Varian](#references)).",
  "Testing Thinking Machines Lab's native looped models (`TML-d24-varloop-research` across `K = 1..5` silent passes and flagship `Inkling-2-Mini` at `K = 3`) across {{garp_budgets_n}} crossing budget lines settles both questions at once. Silent thinking loops make choices **more** morally driven rather than colder, yet `Inkling-2-Mini` obeys Afriat's price-theory test at **{{ink_unc_modal_ccei}}** cost efficiency, breaking down only when silent `0%`-loan subtraction needs a verbal scratchpad.",
]

