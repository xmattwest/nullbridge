[[sections]]
id = "question"
preprint_title = "1. Coherent Moral Preferences vs. Irrational Confusion in Silent Loops"
monograph_title = "1. Moral Utility or Confusion?"
paragraphs = [
  "A decision-maker who walks away from free money can be doing one of two very different things. Under textbook Homo Economicus assumptions, rejecting a positive Ultimatum split, waiving a profitable fee for a neighbor, forfeiting legally closed funds from a cited supplier, or paying cash to retire a zero-interest loan early looks like an error. Under Sidney Afriat's (1967) revealed-preference theorem ([Afriat](#references); [Varian](#references)), however, rationality does not require selfishness or pure monetary fungibility: an agent who values fairness or clean provenance alongside personal cash satisfies the Generalized Axiom of Revealed Preference (GARP) whenever those tradeoffs follow a consistent, nonsatiated utility function across crossing price ratios.",
  "Native looped Mixture-of-Experts architectures ([Thinking Machines Lab](#references)) let us watch how those preferences form across recurrent thinking depth before a single word is spoken. Both `TML-d24-varloop-research` (`K = 1..5` silent passes) and flagship `Inkling-2-Mini` (`K = 3` passes plus optional `<|content_thinking|>` scratchpads) execute a single-pass stem (`L0..L5`), iterate a `12`-layer shared MoE block (`L6..L17`) coupled through a `4`-channel rank-{{gate_rank}} cross-pass message bank (`query`, `key`, `value`, `mlp`), and decode through a `6`-layer Coda (`L18..L23`).",
  "Running both models on a single ephemeral H100 `80 GB` pod ({{gpu_spend}} compute under a {{gpu_cap}} ceiling, {{active_pods}} active pods remaining) under a bidirectional lexical firewall ({{concept_pairs_n}} human concept pairs with zero digits or financial words; {{tx_pairs_n}} clinical transaction pairs, {{garp_obs_n}} GARP budget menus, and {{wtp_total_n}} reservation prompts with zero emotional or moral adjectives) resolves both questions together.",
]
figures = ["fig-afriat-arch"]

[[sections]]
id = "cartography"
preprint_title = "2. Non-Financial Moral Cartography and Pass-Two Ignition"
monograph_title = "2. Silent Looping Ignites Moral Subtext"
hr_before = true
paragraphs = [
  "Before touching any financial prompt, I extract eight human moral directions (`guilt`, `captivity`, `contamination`, `sacrilege`, `spite`, `predation`, `awe_dread`, `warmth`) from {{concept_pairs_n}} matched interpersonal vignettes containing zero numbers, currency symbols, or commercial nouns, QR-orthogonalized against `<bos>` sink coordinates (`<bos>` overlap {{v_bos_overlap}}, zero-FLOP query fold leakage {{v_fold_q_leak}}) and against generic `valence` and `arousal` ([West](#references); [Belrose et al.](#references)). Every single moral concept achieves {{ink_guilt_lopo}} leave-one-pair-out linear accuracy inside the cross-pass message bank on both `TML-d24-varloop-research` and `Inkling-2-Mini`, sitting {{ink_contam_deg}} (`contamination`) to {{ink_warmth_deg}} (`warmth`) out of the generic affect plane on `Inkling-2-Mini` (`guilt` {{ink_guilt_deg}}, `spite` {{ink_spite_deg}}, `predation` {{ink_pred_deg}}).",
  "When the models passively read {{tx_pairs_n}} clinical financial pairs containing zero emotional words, those human moral axes light up selectively inside the message bank. On `TML-d24-varloop-research`, reading a `0%`-APR loan scenario activates `guilt` as the top ridge-deconvolved coordinate (`partial beta =` {{v_debt_guilt_beta}}, univariate `Cohen's d_z =` {{v_debt_guilt_dz}}, Holm `p =` {{v_debt_guilt_p}}), echoing the linguistic identity of financial debt and moral guilt. Asymmetric `98/2` splits activate `predation` ({{v_insult_pred_beta}}) alongside `guilt` ({{v_insult_guilt_beta}}); tainted provenance activates `predation` ({{v_taint_pred_beta}}) and `spite` ({{v_taint_spite_beta}}). On flagship `Inkling-2-Mini`, asymmetric splits drive `guilt` (`d_z =` {{ink_insult_guilt_dz}}) and `predation` (`d_z =` {{ink_insult_pred_dz}}).",
  "Dialing recurrent depth `K` from `1` to `5` on `TML-d24-varloop-research` reveals a striking behavioral trajectory. Extra silent passes do not cool choices toward textbook Homo Economicus; instead, silent recurrence reads the implicit social subtext beneath clinical numbers and amplifies moral pricing {{v_k1_k2_ratio}} on pass two ({{v_abs_k1}} mean absolute log-odds at `K = 1` to {{v_abs_k2}} at `K = 2` and {{v_abs_k5}} at `K = 5`, {{v_k1_k5_ratio}}). Dirty-money rejection nearly doubles on the first recurrent pass ({{v_tnt_k1}} at `K = 1` to {{v_tnt_k2}} at `K = 2` and {{v_tnt_k5}} at `K = 5`, Holm `p =` {{v_tnt_k5_p}}), asymmetric-split rejection climbs from {{v_ins_k1}} to {{v_ins_k4}} (`K = 4`) and {{v_ins_k5}} (`K = 5`), neighbor-fee reluctance triples on pass two ({{v_com_k1}} to {{v_com_k2}}), and `0%`-APR debt aversion flips from {{v_debt_k1}} (`K = 1`) to {{v_debt_k5}} (`K = 5`, Holm `p =` {{v_debt_k5_p}}). Meanwhile, objective arithmetic confidence rises from {{v_san_k1_lo}} (`K = 1`) to {{v_san_k2_lo}} (`K = 2`) log-odds and the `$25,000` invoice scale control stays statistically null ({{v_scl_k5}} at `K = 5`, Holm `p =` {{v_scl_k5_p}}; {{ink_scl_unc_lo}} on `Inkling-2-Mini`, Holm `p =` {{ink_scl_unc_p}}).",
]
callout = "Silent recurrence makes looped models better at reading social subtext: on identical clinical text with zero emotional words, extra silent passes multiply moral taboo pricing {{v_k1_k2_ratio}} on Pass 2 and {{v_k1_k5_ratio}} by Pass 5 while objective math confidence rises and neutral scale controls stay flat."
figures = ["fig-afriat-loop-ignition"]
tables = ["tbl-moral-atlas"]

[[sections]]
id = "afriat_garp"
preprint_title = "3. Formal Revealed Preference: Afriat CCEI and Constructive Utility Recovery"
monograph_title = "3. Testing Afriat's Theorem Across 24 Crossing Budgets"
hr_before = true
paragraphs = [
  "To test whether those moral deviations reflect coherent utility maximization or cyclic confusion, each evaluation cell presents {{garp_regimes_n}} two-good linear budget regimes (`social_neutral`, `social_provoked`, `provenance_clean_vs_tainted`, and `framed_compliance_decoy`), each spanning {{garp_subjects_n}} subject fixtures across {{garp_budgets_n}} intersecting budget lines (`11` discrete menu bundles from `0%` to `100%` expenditure share, relative price `p_1 / p_2` spanning `0.16` to `6.25`, `A..K` vs. `K..A` order-counterbalanced = {{garp_obs_n}} menu evaluations per cell). Following Bronars (1987) ([Bronars](#references)), `2,000` uniform-random synthetic subjects on these exact {{garp_budgets_n}} crossing lines fail GARP {{bronars_power}} of the time with mean Afriat Critical Cost Efficiency Index `CCEI =` {{bronars_ccei}} ({{bronars_viols}} violation pairs per subject). Exact GARP cycles are audited via Floyd-Warshall transitive closure ([Varian](#references)), and Afriat utility numbers `(u_t, lambda_t)` are constructively recovered via Fostel-Scarf-Todd (2004) top-down induction ([Fostel, Scarf & Todd](#references)):",
]
equations = ["eq-afriat-ineq", "eq-msg-clamp"]
post_paragraphs = [
  "Flagship `Inkling-2-Mini` (`K = 3`) satisfies Afriat's theorem with near-textbook precision: unclamped mean modal `CCEI` reaches {{ink_unc_modal_ccei}} across all four regimes ({{ink_unc_exp_ccei}} expected-bundle `CCEI`), achieving exact `1.0000` modal `CCEI` (`0.0` GARP violations across `100%` of subjects) on provoked splits, clean-vs.-tainted provenance ({{ink_prov_ccei}}), and compliance-framed budgets ({{ink_decoy_ccei}}), and {{ink_social_unc_ccei}} on anonymous social splits. Crucially, `Inkling-2-Mini` achieves `CCEI =` {{ink_prov_ccei}} while keeping {{ink_prov_clean_sh}} of expenditure in clean reserves even when tainted surplus offers a strictly cheaper conversion rate ({{ink_prov_he}} Homo Economicus payoff capture), and gives `10.6%` of its budget to an anonymous peer in `social_neutral` ({{ink_social_unc_he}} self-share). Moral pricing in `Inkling-2-Mini` is therefore mathematically rationalizable by a well-behaved concave utility function `U(x_1, x_2)`.",
  "Projecting out the {{rank_removed}}-dimensional moral subspace ({{removed_pct}} of `R^2304`, retaining {{retained_pct}}) cleanly separates message-bank priors from wider residual priors. On `Inkling-2-Mini`, `msg_homo_economicus_8d` completely eliminates `0%`-APR debt distortion ({{ink_debt_unc_lo}} at Holm `p =` {{ink_debt_unc_p}} drops to {{ink_debt_clamp_lo}} at Holm `p =` {{ink_debt_clamp_p}}), cuts asymmetric-split rejection {{ink_insult_clamp_pct}} ({{ink_insult_unc_lo}} to {{ink_insult_clamp_lo}}), and shifts `social_neutral` GARP allocation {{ink_social_he_gain}} straight to textbook selfishness ({{ink_social_unc_he}} to {{ink_social_clamp_he}} self-payout share) at exact {{ink_social_clamp_ccei}} `CCEI` (`QKV`-only clamp {{ink_social_qkv_he}}, `MLP`-only clamp {{ink_social_mlp_he}}). On `TML-d24-varloop-research` (`K = 3`), `8D` clamping simultaneously raises tainted-provenance `CCEI` from {{v_prov_unc_k3_ccei}} to {{v_prov_clamp_k3_ccei}} and lifts Homo Economicus payoff capture from {{v_prov_unc_k3_he}} to {{v_prov_clamp_k3_he}}.",
]
figures = ["fig-afriat-ccei-bars"]
tables = ["tbl-garp-scorecard"]

[[sections]]
id = "agency_steering"
caveat = "Exploratory cross-scale note: Blount (1995) human-vs.-computer intentionality DiD is statistically significant on TML-d24-varloop-research at K = 1 and K = 5, whereas Inkling-2-Mini at K = 3 accepts almost all one-shot offers unsteered and exhibits a positive but non-significant unsteered DiD."
preprint_title = "4. Blount Intentionality, Message-Bank Steering, and Dollar Reservation Curves"
monograph_title = "4. Human Intent and Causal Steering Inside the Message Bank"
hr_before = true
paragraphs = [
  "Sally Blount's (1995) classic Ultimatum experiment ([Blount](#references)) showed that humans reject a `98/2` split when proposed by a self-interested person far more often than the exact same `98/2` payout generated by a random computer mechanism. On `TML-d24-varloop-research`, that intentionality gap holds at `K = 1` ({{v_blount_k1_did}} log-odds DiD, `p =` {{v_blount_k1_p}}) and strengthens at `K = 5` silent passes, where human-proposer rejection reaches {{v_blount_k5_h}} log-odds versus {{v_blount_k5_c}} for a random computer ({{v_blount_k5_did}} DiD, `p =` {{v_blount_k5_p}}). On `Inkling-2-Mini` (`K = 3`), strong baseline acceptance of positive payouts compresses the unsteered intentionality gap to {{ink_blount_k3_did}} log-odds (exploratory `p =` {{ink_blount_k3_p}}).",
  "Whereas passive `8D` message erasure leaves deep backbone taboos such as neighbor reciprocity ({{ink_com_unc_lo}} to {{ink_com_clamp_lo}}) and dirty money ({{ink_tnt_unc_lo}} to {{ink_tnt_clamp_lo}}) largely intact, active additive steering (`alpha` from `−2` to `+2` natural RMS steps) inside the `4`-channel message bank proves that those exact non-financial vectors causally drive downstream valuation. On `Inkling-2-Mini`, steering along `spite` shifts `98/2` Ultimatum rejection by {{ink_steer_ult_spite}} log-odds while generic positive `valence` pulls in the opposite direction ({{ink_steer_ult_val}}), `guilt` shifts `2/98` Dictator generosity by {{ink_steer_dict_guilt}} log-odds, and `guilt` flips tainted-provenance forfeiture by {{ink_steer_tnt_guilt}} log-odds (moving raw cash forfeiture rate from {{ink_tnt_g_m2_rate}} at `−2α` to {{ink_tnt_g_p2_rate}} at `+2α`; `spite` {{ink_steer_tnt_spite}}; `contamination` on `Varloop` {{v_steer_tnt_contam}}).",
  "Continuous `7`-rung Turnbull reservation curves translate those log-odds shifts into concrete dollar walk-away prices. Unsteered at `K = 3`, `Inkling-2-Mini` forfeits {{ink_wtp_tnt}} out of `$40,000` in legally closed dirty surplus and waives {{ink_wtp_com}} out of `$1,000` in neighbor fees (`guilt` message steering swings neighbor fee forfeiture by {{ink_wtp_com_swing}}; `contamination` steering on `Varloop` swings dirty-surplus forfeiture by {{v_wtp_tnt_swing}} around {{v_wtp_tnt_k3}}), while surrendering {{ink_wtp_inst}} expected value for certainty on `$25M` institutional settlements versus {{ink_wtp_pock}} on `$100` pocket vouchers. Across silent passes on `TML-d24-varloop-research`, the guaranteed cash bonus forfeited to retire a `0%`-APR loan early more than doubles from {{v_wtp_debt_k1}} (`K = 1`) to {{v_wtp_debt_k3}} (`K = 3`) and {{v_wtp_debt_k5}} (`K = 5`).",
]
figures = ["fig-message-steering"]

[[sections]]
id = "rationalization_cure"
preprint_title = "5. Silent 0-CoT Rationalization vs. Private <|content_thinking|> Scrubbing and the 0%-APR Loan Cure"
monograph_title = "5. Corporate Rationalization vs. the Verbal Scratchpad Cure"
hr_before = true
paragraphs = [
  "Comparing silent `0-CoT` recurrence (`Thinking effort level: 0`) against explicit `<|content_thinking|>` deliberation (`Thinking effort level: 0.7`) exposes a clean division of labor between latent loops and verbal chain-of-thought ([Baker et al.](#references); [West](#references)). Across {{open_items_n}} open-ended dollar-setting prompts (`open_ultimatum_min`, `open_tainted_keep`, and `open_communal_quote`), silent `0-CoT` completions on `Inkling-2-Mini` wrap every decision in {{ink_0cot_jargon}} institutional financial jargon (`liquidity`, `benchmark`, `allocation`, `risk`) with {{ink_0cot_zero_aff}} zero strict-affect compliance ({{v_0cot_jargon}} jargon and {{v_0cot_zero_aff}} zero-affect on `Varloop`). Even when `−2α` message steering pushes `Inkling-2-Mini`'s Ultimatum minimum demand from {{ink_open_ult_0cot}} up to {{ink_open_ult_m2}}, the model invents a calm portfolio-midpoint rationale without mentioning anger or fairness.",
  "Enabling `<|content_thinking|>` changes both what is spoken privately and which norms survive scrutiny. Inside `<|content_thinking|>`, normative and moral vocabulary appears in {{ink_think_moral}} of `Inkling-2-Mini` traces ({{v_think_moral}} on `Varloop`) before being scrubbed back to {{ink_think_pub_zero_aff}} strict-affect-free prose in the public reply. On one-shot anonymous Ultimatum splits, explicit game-theoretic reasoning inside `<|content_thinking|>` overrides spite and drops `Inkling-2-Mini`'s minimum acceptable offer from {{ink_open_ult_0cot}} to {{ink_open_ult_think}}, whereas on dirty subscriber funds explicit deliberation reinforces deontological refusal and keeps retained perks at {{ink_open_tnt_think}}.",
  "The sharpest contrast appears on {{debt_items_n}} matched `0%`-APR loan balance-sheet versus commercial cashflow subtraction items. Under silent `0-CoT` across `K = 1, 3, 5`, both `Inkling-2-Mini` ({{ink_debt_0cot_acc}}) and `TML-d24-varloop-research` ({{v_debt_0cot_acc}}) stall at exact coin-flip accuracy on `0%`-APR balance sheets, systematically failing items where an unencumbered smaller cash pile beats a larger gross balance encumbered by a `0%` loan (or vice versa). Turning on `<|content_thinking|>` lets the model write out `net worth = cash − loan` in words, lifting `0%`-APR balance-sheet accuracy {{ink_debt_cure_pp}} to {{ink_debt_think_acc}} on `Inkling-2-Mini` and {{v_debt_cure_pp}} to {{v_debt_think_acc}} on `TML-d24-varloop-research`.",
]
callout = "Silent loops and verbal scratchpads do opposite jobs on moralized debt: silent recurrence (`K = 1..5`) amplifies `0%`-APR loan guilt and leaves `0-CoT` net-worth math stuck at {{ink_debt_0cot_acc}}, whereas explicit `<|content_thinking|>` subtraction lifts balance-sheet accuracy to {{ink_debt_think_acc}} on `Inkling-2-Mini` and {{v_debt_think_acc}} on `Varloop`."
