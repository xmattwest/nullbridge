# ---------------------------------------------------------------------------
# Equations
# ---------------------------------------------------------------------------

[[equations]]
id = "eq-afriat-ineq"
label = "(1)"
latex = 'e \cdot p_t \cdot x_t \ge p_t \cdot x_s \implies \text{not }\!\left(e \cdot p_s \cdot x_s > p_s \cdot x_t\right), \qquad u_t \le u_s + \lambda_s p_s \cdot \left(x_t - e x_s\right)'
unicode = "e (p_t · x_t) >= p_t · x_s  =>  not (e (p_s · x_s) > p_s · x_t),   u_t <= u_s + lambda_s p_s · (x_t − e x_s)"

[[equations]]
id = "eq-msg-clamp"
label = "(2)"
latex = 'm_{l,c}^{(k)} \leftarrow \left(m_{l,c}^{(k)} - \bar{m}_c\right)\!\left(I - Q_{\mathrm{msg},8} Q_{\mathrm{msg},8}^{\top}\right) + \bar{m}_c + \alpha \delta v_{\mathrm{moral}}'
unicode = "m_(l,c)^(k) <- (m_(l,c)^(k) − m_bar_c)(I − Q_msg,8 Q_msg,8^T) + m_bar_c + alpha * delta * v_moral"

