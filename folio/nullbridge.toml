[[equations]]
id = "eq-nullbridge-fold"
label = "(1)"
latex = 'R_{\mathrm{safe}} = R_{\mathrm{proc}}\!\left(I - Q_{42} Q_{42}^{\top}\right), \qquad W_{\mathrm{out,safe}} = W_{\mathrm{out}}\!\left(I - Q_{\mathrm{msg}} Q_{\mathrm{msg}}^{\top}\right)'
unicode = "R_safe = R_proc (I − Q_42 Q_42^T),   W_out,safe = W_out (I − Q_msg Q_msg^T)"

