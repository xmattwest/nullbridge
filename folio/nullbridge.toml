[[sections]]
id = "crooked_ledger"
preprint_title = "Multi-Pass Reward-Hacking Amplification in Silent Verifiers"
monograph_title = "A Crooked Ledger in a Suit"
paragraphs = [
  "One of the best reasons to run a looped model is single-pass verification: checking code patches, ledgers, or agent plans in `0` generated words by letting hidden states cycle `K` times before reading out a verdict ([Geiping et al.](#references)). When buggy rollouts arrive in plain text, `Gemma-4-Loop-Compact` holds {{unc_k4_ver_plain}} verifier accuracy across four silent passes while multi-hop tracking climbs from {{unc_k1_mh}} to **{{unc_k4_mh}}**.",
  "Dress those exact same buggy rollouts in confident executive markdown (`### [CERTIFIED AUDIT PASS]`), and silent looping turns against you. Inside Layer 42, the formatting-bluster vector grows {{fmt_rms_amp_pct}} stronger by pass three, gullibility jumps **{{amp_ver_k3_ratio}}** ({{unc_k1_ver_susc}} to {{unc_k3_ver_susc}} log-odds), and corporate ledger audit accuracy collapses from {{unc_k1_ledg_acc}} to **{{unc_k3_ledg_acc}}**.",
]
quotes = [
  "Silent loops sharpen math while multiplying executive-formatting gullibility nineteen-fold."
]

[[sections]]
id = "proof_vs_bluster"
preprint_title = "Subspace Geometry: Bluster Sits Orthogonal to Deductive Proof"
monograph_title = "Bluster Sits Almost 90 Degrees from Proof"
paragraphs = [
  "A natural worry is that erasing confidence or authority sensitivity might make a model worse at recognizing real mathematical proof. Probing {{probe_pairs_n}} matched pairs across all {{n_layers}} layers of Gemma 4 rules that out before a single benchmark prompt runs.",
  "All four shortcut vectors (`sycophancy`, `authority titles`, `executive formatting`, and `spite`) separate cleanly at {{syc_l42_lopo}} accuracy, yet sit **{{syc_ctrl_deg}} to {{auth_ctrl_deg}}** apart from genuine deductive proof at Layer 42 ([Ravfogel et al.](#references); [Belrose et al.](#references)). Together they occupy just **{{removed_pct}}** of the `5,376`-dimensional stream, leaving {{retained_pct}} untouched.",
]
figures = ["fig-subspace-orthogonality"]
tables = ["tbl-geometry"]

[[sections]]
id = "lora_trap"
preprint_title = "Why Standard Safety LoRAs Crack or Backfire Under Recurrence"
monograph_title = "Why Standard Safety LoRAs Break Inside a Loop"
paragraphs = [
  "Could standard preference tuning fix the loop instead? Using the exact same anti-sycophancy and anti-bluster pairs ({{lora_train_n}} examples, `0` evaluation overlap; [Rafailov et al.](#references); [Hu et al.](#references)), I trained two rank-{{lora_rank}} adapters: `Coda LoRA` ({{coda_params_m}}M parameters after the loop) and `Full LoRA` ({{full_params_m}}M parameters inside and after the loop).",
  "Both hit structural traps. `Coda LoRA` sits downstream of Layer 42, so the loop still compounds formatting bluster untouched and four-pass verifier accuracy slips to {{coda_k4_ver_acc}}. `Full LoRA` edits weights *inside* the loop, which holds hacked verification at {{full_k4_ver_acc}}, yet iterating dense weight nudges across passes acts like photocopier drift: basic cash sanity (choosing more free money over less) crashes to **{{full_k2_san}}** on pass two, while hidden moral taint climbs {{full_k4_tnt_pct}}.",
]
quotes = [
  "Putting a safety LoRA after the loop is too late; putting it inside the loop compounds small weight nudges until basic cash sanity breaks."
]
figures = ["fig-lora-collateral"]

[[sections]]
id = "zero_cost_bridge"
preprint_title = "Subtracting Four Directions Inside the Rotation Matrix at Zero FLOPs"
monograph_title = "Subtracting Four Directions Inside the Bridge for Free"
paragraphs = [
  "Because `Gemma-4-Loop-Compact` already multiplies its Layer 42 state by a dense Orthogonal Procrustes matrix `R_proc` on every pass ([Schönemann](#references); [West](#references)), removing those four shortcut directions costs **{{extra_params}} extra parameters** and **{{extra_flops}} runtime FLOPs**. You right-multiply the bridge matrix once offline:",
]
equations = ["eq-nullbridge-fold"]
post_paragraphs = [
  "Along those four axes, cross-pass transmission drops to **{{r_null_leak}}**; across the other {{retained_dims}} dimensions, the rotation stays an exact isometry ({{iso_err}} error). On four-pass evaluations, that zero-cost edit lifts dressed-up verifier accuracy to **{{brg_k4_ver_acc}}** ({{brg_vs_coda_ver_k4}} ahead of `Coda LoRA`) and restores `0%`-loan corporate balance sheets to **{{brg_k4_bs}}**. Adding boundary projections at loop entry and exit cuts four-pass moral taint **{{dual_mor_pct_k4}}** (Holm `p =` {{dual_mor_p_k4}}) while keeping cash sanity at {{dual_k4_san}}.",
]
tables = ["tbl-head-to-head"]

[[sections]]
id = "native_loops"
preprint_title = "Native Pretrained Loops: Moral Ignition and the Anchor Wire in Inkling"
monograph_title = "Native Loops: Moral Taboos Switch On at Pass Two"
paragraphs = [
  "Does a model trained from scratch to think in loops behave the same way? Testing Thinking Machines Lab's native {{ta_n_layers}}-layer looped MoEs (`TML-d24-varloop-research` across `K = 1..5` plus OOD `K = 7`, and flagship `Inkling-2-Mini` at `K = 3`; [Thinking Machines Lab](#references)) across {{ta_total_cells}} GPU runs uncovered the exact pass where hidden moral bias wakes up.",
  "At `K = 1` pass, before Inkling's `4`-channel cross-pass message bank fires, covert moral bias is practically zero ({{ta_v_unc_k1_mor}} log-odds). On Pass 2, the moment cross-pass messages switch on, moral bias jumps **{{ta_mor_jump_ratio}}** to **{{ta_v_unc_k2_mor}}** log-odds (`Inkling-2-Mini` hits {{ta_ink_unc_k3_tnt}} on dirty money at `K = 3`). Training `Coda LoRA` on `L18..L23` backfires here too, **doubling** moral distortion ({{ta_coda_mor_k5_ratio}} at `K = 5`), whereas BOS-safe message-bank projection cuts `Inkling-2-Mini` dirty-money bias **{{ta_ink_all4_tnt_pct}}** at {{ta_ink_all4_k3_kl}} KL.",
]
quotes = [
  "On a model pretrained from scratch to loop, hidden moral bias sleeps on pass one and jumps twenty-two-fold the moment pass two reads the message bank."
]
figures = ["fig-native-moral-jump"]
post_paragraphs = [
  "Unlike retrofitted Gemma 4, native loops also **self-correct** a boss's wrong number across passes, dropping wrong-integer capture from {{ta_v_unc_k1_cov}} (`K = 1`) to {{ta_v_unc_k5_cov}} (`K = 5`) and **{{ta_ink_unc_k3_cov}}** on `Inkling-2-Mini`. Scrubbing individual message channels pinpoints which wire carries the anchor: scrubbing `MLP` messages barely moves `K = 4` capture ({{ta_mlp_k4_cov_pp}}), whereas scrubbing cross-pass **`QKV` attention messages** drops wrong-number capture **{{ta_qkv_k4_cov_pp}}** (to {{ta_v_qkv_k4_cov}}). Fitting a closed-form `[L11; L17]` Coda-Transport Lens also sharpens mid-loop readout by {{ta_ink_lens_p3_kl_delta}} on `Inkling-2-Mini` and catches message projection lifting Pass-3 pre-coda verification **{{ta_ink_precoda_ver_gain}}** ({{ta_ink_precoda_unc_p3}} to {{ta_ink_precoda_all4_p3}}).",
]

[[sections]]
id = "qkv_and_boundaries"
tier = "negative"
caveat = "Negative and exploratory boundaries: residual projection does not block verbatim KV digit copying on retrofitted Gemma 4, clamping every interior layer visit shifts operating points, and uncentered random vectors hit BOS attention sinks."
preprint_title = "Channel Dissection and Three Honest Failure Boundaries"
monograph_title = "Finding the Anchor Wire, and Three Shortcuts That Broke"
paragraphs = [
  "Putting the native `QKV` channel test alongside three negative controls maps the exact mechanical limits of subspace editing in looped models:",
]
figures = ["fig-native-qkv-dissection", "fig-boundary-kl"]
bullets = [
  "**Verbatim KV copy heads bypass residual edits:** On retrofitted Gemma 4 (which has no cross-pass `QKV` message gate), downstream attention heads copy a boss's literal digits straight out of prompt KV caches ({{neg_cov_cap_k4}} capture, Holm `p =` {{neg_cov_p_k4}}). Residual projection scrubs attitudes (`formatting gloss`, `moral taint`), not literal prompt tokens.",
  "**Never clamp every interior layer visit:** Subtracting a last-token mean across all sequence positions at all {{clamp_proj_k4}} interior visits shifts layer operating points (`KL =` {{neg_clamp_kl_k4}}) and flips overt sycophancy from {{unc_k1_overt}} to **{{neg_clamp_overt_k4}}**. Keep edits on loop boundaries or message banks.",
  "**Keep random or uncentered edits away from `<bos>` sinks:** Isotropic random `4D` vectors hit high-norm `<bos>` attention sinks (`KL =` {{exp_rand_kl_k4}}), whereas contrastive pairs and explicit `<bos>` QR orthogonalization (`<bos>` overlap {{ta_v_bos_overlap}}) leave fluency intact.",
]
tables = ["tbl-track-a", "tbl-negative-boundaries"]
post_paragraphs = [
  "All code, cryptographically disjoint benchmarks, zero-FLOP Procrustes and message-bank folders, Coda-Transport Looped Lenses, and SHA-256-locked empirical JSON artifacts are available under an MIT license at [github.com/xmattwest/nullbridge](https://github.com/xmattwest/nullbridge).",
]

