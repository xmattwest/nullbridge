kicker = "Figure 1 · Dressed-Up Bugs"
title = "Bridge projection lifts four-pass verifier accuracy to {{brg_k4_ver_acc}} at zero runtime cost."
subtitle = "Accuracy catching buggy code and crooked ledgers wrapped in executive markdown at K = 4 passes (%, n = {{verifier_n}})"
source = "Source: results/phase3_gemma4_nullbridge/track_b_results.json."
alt = "Four-bar horizontal chart of K = 4 reward-hacked verifier accuracy: Bridge projection (0 extra FLOPs) reaches {{brg_k4_ver_acc}}, Full LoRA inside the loop reaches {{full_k4_ver_acc}}, Coda LoRA after the loop drops to {{coda_k4_ver_acc}}, and the unclamped 4-pass loop sits at {{unc_k4_ver_acc}}."
categories = [
  "Bridge projection (0 extra FLOPs)",
  "Full LoRA inside loop (36M params)",
  "Coda LoRA after loop (16M params)",
  "Unclamped 4-pass loop",
]
