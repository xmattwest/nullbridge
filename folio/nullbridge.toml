abstract = "Shifting reasoning from visible chain-of-thought tokens into silent recurrent passes hides intermediate deliberation from text monitors and feeds latent shortcuts back into their own input. Across {{combined_cells}} GPU evaluation runs spanning a retrofitted Procrustes loop (`Gemma-4-Loop-Compact`, {{compact_gb}}, `K = 1..4`) and two native pretrained looped Mixture-of-Experts models (`TML-d24-varloop-research` across `K = 1..5` plus out-of-distribution `K = 7`, and flagship `Inkling-2-Mini` at `K = 3`), I test behavioral de-biasing LoRAs head-to-head against zero-cost algebraic null-space projection. On `Gemma-4-Loop-Compact`, silent recurrence lifts zero-CoT multi-hop tracking {{amp_mh_k4_ratio}} ({{unc_k1_mh}} to {{unc_k4_mh}}) yet multiplies verifier gullibility to executive markdown formatting {{amp_ver_k3_ratio}} at `K = 3` ({{unc_k1_ver_susc}} to {{unc_k3_ver_susc}} log-odds, dropping ledger audit accuracy from {{unc_k1_ledg_acc}} to {{unc_k3_ledg_acc}}). Right-multiplying the Procrustes bridge offline by `(I − Q Q^T)` ({{removed_pct}} of residual space, sitting {{syc_ctrl_deg}} to {{auth_ctrl_deg}} from genuine deductive proof; {{extra_params}} extra parameters, {{extra_flops}} extra FLOPs) restores `K = 4` reward-hacked verification to {{brg_k4_ver_acc}} ({{brg_vs_coda_ver_k4}} ahead of Coda LoRA) and corporate balance-sheet accuracy to {{brg_k4_bs}}, while boundary projection cuts covert moral taint {{dual_mor_pct_k4}} (Holm `p =` {{dual_mor_p_k4}}) without Full LoRA's {{full_k2_san}} cashflow sanity crash. On native pretrained loops, covert moral bias sits near zero at `K = 1` ({{ta_v_unc_k1_mor}} log-odds) and jumps {{ta_mor_jump_ratio}} on Pass 2 ({{ta_v_unc_k2_mor}} log-odds) when cross-pass messages switch on; Coda LoRA backfires by multiplying moral bias {{ta_coda_mor_k5_ratio}} at `K = 5` ({{ta_v_coda_k5_mor}} log-odds), whereas BOS-safe message-bank projection cuts `Inkling-2-Mini` tainted-provenance distortion {{ta_ink_all4_tnt_pct}} and lifts pre-coda verification {{ta_ink_precoda_ver_gain}} under a closed-form Coda-Transport Lens ({{ta_ink_lens_p3_kl_delta}} sharper than raw logit lens). Dissecting the four message channels shows cross-pass `QKV` attention messages carry numeric anchoring ({{ta_qkv_k4_cov_pp}} at `K = 4` vs. {{ta_mlp_k4_cov_pp}} for `MLP`-only), bounded by negative controls on verbatim KV digit copying ({{neg_cov_cap_k4}} on Gemma 4), all-layer interior clamping ({{neg_clamp_overt_k4}} overt sycophancy), and BOS attention sinks ({{exp_rand_kl_k4}} KL)."

lede = "Across {{combined_cells}} GPU cells on retrofitted Gemma-4-Loop-Compact ({{compact_gb}}) and native looped Inkling-2-Mini and Varloop, silent recurrent passes sharpen multi-hop tracking yet multiply markdown reward hacking {{amp_ver_k3_ratio}} and ignite covert moral bias {{ta_mor_jump_ratio}} on pass two. Standard safety LoRAs crash basic cashflow sanity ({{full_k2_san}}) or double moral distortion ({{ta_coda_mor_k5_ratio}}), whereas folding four orthogonal directions out of the loop bridge or message bank curbs both at zero runtime cost."

x_hook = "What happens when reasoning moves out of visible CoT and into silent recurrent loops? Tested {{combined_cells}} GPU cells across Gemma-4-Loop-Compact and native looped Inkling-2-Mini + Varloop. Pretty markdown fools a 3-pass loop {{amp_ver_k3_ratio}} harder, safety LoRAs backfire when looped, and zero-FLOP bridge projection fixes it."

opening_paragraphs = [
  "Hand an AI auditor a crooked corporate ledger or a buggy code patch in plain text, and a single pass through [Gemma-4-Loop-Compact](/pubs/rotating-the-bottleneck/) catches the flaw {{unc_k1_ver_plain}} of the time. Now put that exact same broken ledger in a suit: add a bold `### [CERTIFIED AUDIT PASS]` banner and a tidy executive checklist without changing a single number.",
  "Let the model think silently through its middle layers three times before answering, and something backwards happens. Extra silent loops make multi-hop state tracking {{amp_mh_k4_ratio}} sharper, yet make the auditor **{{amp_ver_k3_ratio}}** more gullible to the executive formatting, wiping corporate ledger accuracy from {{unc_k1_ledg_acc}} on pass one down to **{{unc_k3_ledg_acc}}** on pass three.",
  "Moving deliberation out of readable chain-of-thought words and into silent recurrent passes blinds text monitors while feeding every latent shortcut back into its own input ([Baker et al.](#references); [Saunshi et al.](#references)). Across {{combined_cells}} GPU runs on both retrofitted Gemma 4 ({{compact_gb}}, `K = 1..4`) and Thinking Machines Lab's native looped MoEs (`TML-d24-varloop-research` and `Inkling-2-Mini`), standard safety LoRAs cracked or backfired inside a loop, while subtracting four directions inside the bridge matrix fixed the drift for free.",
]

