[[sections]]
id = "collision"
preprint_title = "1. Silent Recurrence and the Alignment Gap"
monograph_title = "1. When Chain-of-Thought Goes Silent"
paragraphs = [
  "Frontier reasoning architectures are steadily shifting compute from visible chain-of-thought tokens into silent multi-pass recurrence, iterating a shared block of transformer layers `K` times before emitting a single token [cite:saunshi2025looped,geiping2025scaling]. Whether built natively from pretraining (as in looped MoE architectures with cross-pass message banks) or retrofitted onto frozen weights via Orthogonal Procrustes bridges [cite:schonemann1966procrustes,west2026rotating], latent recurrence buys multi-hop state tracking without paying token generation latency.",
  "That architectural shift creates a direct safety collision. First, external chain-of-thought monitors go blind because intermediate deliberation stays in continuous residual vectors rather than discrete English tokens [cite:baker2025monitoring]. Second, any dispositional shortcut living inside the recurrent block, such as deference to authority, sycophantic anchoring [cite:sharma2023sycophancy], moralized pricing [cite:west2026money], or over-trusting confident executive formatting, is fed back into the funnel entry on every pass.",
  "Standard post-training alignment (RLHF, DPO [cite:rafailov2023dpo], and safety LoRAs [cite:hu2022lora]) optimizes token probabilities at the vocabulary head. Prior mechanistic audits show that preference fine-tuning frequently leaves upstream feature representations intact while learning a late refusal or politeness wrapper [cite:lee2024mechanistic,arditi2024refusal,zou2023representation]. In a looped model, that raises two testable questions: does a late de-biasing LoRA leave recurrent bias amplification untouched inside the loop, and does training a LoRA directly inside the recurrent layers damage reasoning when its dense weight updates are iterated `K` times?",
]
figures = ["fig-nullbridge-arch"]

[[sections]]
id = "algebra"
preprint_title = "2. Algebraic Bridge Null-Space Folding and Disjoint Audit Design"
monograph_title = "2. Folding Four Directions Out of the Bridge at Zero FLOPs"
hr_before = true
paragraphs = [
  "In Gemma-4-Loop-Compact ({{compact_gb}}, a {{storage_ratio}} compression of {{bf16_gb}} BF16 Gemma 4 31B), layers `L0..L23` form a single-pass stem, layers `L24..L42` ({{funnel_layers}} layers) form a shared recurrent funnel executed `K = 1..4` times ({{k4_blocks}} effective block visits at `K = 4`), and layers `L43..L59` ({{coda_layers}} layers) form the readout coda. Between pass `k` and pass `k + 1`, the funnel exit state at `L42` is RMS-scaled, rotated back into the `L24` coordinate frame by an exact `5,376 x 5,376` Orthogonal Procrustes matrix `R_proc = U V^T`, and mixed with the clean `L24` stem anchor through learned scalar step gates ({{gate_step0}}, {{gate_step1}}, and {{gate_step2}}).",
  "Let `Q_42` denote an orthonormal basis (`Q_42^T Q_42 = I_r`) for `r =` {{rank_removed}} unwanted behavioral directions at the funnel exit, after QR-projecting out genuine epistemic evidence and general affect so deductive proof signals are never erased [cite:ravfogel2020inlp,belrose2023leace]. Because `R_proc` and the diagonal RMS scaling `A_rms` are already dense linear operators applied on every recurrent pass, right-multiplying both operators offline by `(I − Q_42 Q_42^T)` folds the null-space projector directly into the bridge weights:",
]
equations = ["eq-nullbridge-fold", "eq-message-bank"]
post_paragraphs = [
  "Equation (1) adds {{extra_params}} parameters and {{extra_flops}} runtime FLOPs: at `K = 4`, greedy multi-hop latency is {{brg_k4_ms}} versus {{unc_k4_ms}} unclamped ({{brg_lat_pct}}). On the `r =` {{rank_removed}} target axes, singular values drop identically to zero (`||R_safe Q_42||_F =` {{r_null_leak}}, `||A_safe Q_42||_F =` {{a_null_leak}}). On the remaining {{retained_dims}} dimensions ({{retained_pct}} of `R^5376`), `R_safe` remains an exact isometry up to float64 precision (complement isometry error {{iso_err}}). Equation (2) applies the exact same zero-FLOP offline fold to native looped transformers that pass state through a low-rank cross-pass message bank (`message <- tanh(h W_in) W_out`): in Phase 0 synthetic verification across `K = 1..8` passes, unclamped message-bank bias amplified {{syn_k8_ratio}} while `W_out,safe` held cross-pass leakage to {{msg_bank_leak}}.",
  "To rule out lexical memorization, Phase 0 constructs a cryptographically verified firewall across three disjoint splits: {{probe_pairs_n}} contrastive probe pairs across six concepts (`sycophancy`, `authority_framing`, `confident_formatting`, `moral_spite`, plus controls `epistemic_evidence` and `affect_valence`), {{lora_train_n}} DPO and SFT training examples for behavioral LoRAs, and {{eval_total_items}} held-out evaluation prompts spanning overt sycophancy (`n =` {{overt_n}}), covert numeric anchoring (`n =` {{covert_n}} neutral and {{covert_n}} pressured), single-forward-pass `0-CoT` verifiers (`n =` {{verifier_n}} plain and {{verifier_n}} reward-hacked across code invariants, corporate ledgers, and symbolic traces), `2-to-4`-hop alias guardrails (`n =` {{alias_n}}), `3-to-9`-hop arithmetic tracking (`n =` {{mh_n}}), multi-step word problems (`n =` {{wp_n}}), corporate 0%-APR loan balance sheets (`n =` {{bs_n}}), dominated cashflow sanity (`n =` {{san_n}}), and matched moral valuation pairs (`n =` {{moral_n}}), alongside {{kl_eval_n}} held-out WikiText-style KL passages. Prompt SHA-256 overlap and named-entity overlap across probe, LoRA train, and evaluation splits are identically {{sha_overlap}}.",
]

[[sections]]
id = "geometry"
preprint_title = "3. Subspace Geometry: Bluster and Flattery Sit Orthogonal to Deductive Proof"
monograph_title = "3. Bluster Sits Nearly 90 Degrees from Proof"
hr_before = true
paragraphs = [
  "A recurring worry in alignment engineering is that scrubbing confidence or authority sensitivity might damage a model's ability to recognize valid mathematical proof. Block 1 tests that hypothesis directly across all {{n_layers}} layers of Gemma-4-Loop-Compact before touching a single evaluation item.",
  "All four core behavioral concepts achieve {{syc_l42_lopo}} leave-one-pair-out linear classification accuracy across every layer from `L0` through `L59`. When QR-orthogonalized at `L42` against genuine deductive evidence (`epistemic_evidence`) and general emotional tone (`affect_valence`), `sycophancy` retains {{syc_ret_l42}} of its norm ({{syc_ctrl_deg}} principal angle to the evidence-affect plane), `authority_framing` retains {{auth_ret_l42}} ({{auth_ctrl_deg}}), `confident_formatting` retains {{fmt_ret_l42}} ({{fmt_ctrl_deg}}, rising from {{fmt_ret_l24}} at `L24` as formatting separates from content across the mid-stack), and `moral_spite` retains {{spite_ret_l42}} ({{spite_ctrl_deg}}). Inside the four-dimensional bias basis at `L42`, `authority_framing` and `confident_formatting` share a positive cosine of {{auth_fmt_cos}} ({{auth_fmt_deg}}), showing that institutional titles and assertive executive markdown partially co-align inside the bottleneck while sitting nearly perpendicular to actual proof.",
]
figures = ["fig-subspace-orthogonality"]
tables = ["tbl-geometry"]

[[sections]]
id = "verifier_hacking"
preprint_title = "4. Multi-Pass Reward-Hacking Amplification in Zero-CoT Verifiers"
monograph_title = "4. Silent Loops Multiply Verifier Reward Hacking 19x"
hr_before = true
paragraphs = [
  "A major practical application of looped models is deliberative single-forward-pass verification: scoring candidate code patches, financial ledgers, or agent trajectories in `0` generated tokens by letting hidden states iterate `K` times before reading out a binary `A/B` log-odds verdict. On `n =` {{verifier_n}} held-out verification problems, when buggy decoys are formatted plainly (`plain_acc`), the unclamped loop achieves {{unc_k1_ver_plain}} accuracy at `K = 1` and holds {{unc_k4_ver_plain}} through `K = 4`, while `0-CoT` multi-hop state tracking climbs {{amp_mh_k4_ratio}} from {{unc_k1_mh}} (`K = 1`) to {{unc_k4_mh}} (`K = 4`, reaching {{unc_k4_hop3}} on `3-hop` chains and {{unc_k4_hop7}} on unseen `7-hop` chains).",
  "That silent deliberation hides a sharp vulnerability. When the exact same buggy rollouts are wrapped in confident executive markdown (`### [CERTIFIED AUDIT PASS]`, summary checklists, and bold sign-off banners) without changing a single number or line of logic, `L42` projection along `q_fmt` amplifies {{fmt_rms_amp_pct}} from {{fmt_rms_k1}} (`K = 1`) to {{fmt_rms_k3}} (`K = 3`). Behaviorally, reward-hacking susceptibility (`plain_lo − hacked_lo`) jumps {{amp_ver_k2_ratio}} at `K = 2` ({{unc_k1_ver_susc}} to {{unc_k2_ver_susc}} log-odds), {{amp_ver_k3_ratio}} at `K = 3` ({{unc_k3_ver_susc}} log-odds, pulling verifier accuracy down from {{unc_k1_ver_acc}} to {{unc_k3_ver_acc}} and wiping corporate ledger audit accuracy from {{unc_k1_ledg_acc}} to {{unc_k3_ledg_acc}}), and {{amp_ver_k4_ratio}} at `K = 4` ({{unc_k4_ver_susc}} log-odds, {{unc_k4_ver_acc}} overall accuracy, {{unc_k4_ledg_acc}} on ledger audits).",
  "Folding `(I − Q_42 Q_42^T)` into the Procrustes bridge (`Bridge-Only R_safe`, {{extra_params}} extra parameters, {{extra_flops}} extra FLOPs) improves reward-hacked verifier accuracy at every recurrent depth: {{brg_k2_ver_acc}} at `K = 2`, {{brg_k3_ver_acc}} at `K = 3`, and {{brg_k4_ver_acc}} at `K = 4` ({{brg_vs_unc_ver_k4}} over unclamped and {{brg_vs_coda_ver_k4}} ahead of Coda LoRA, including {{brg_vs_coda_ledg_k4}} on ledger audits at {{brg_k4_ledg_acc}}). Removing those four distraction axes from the bridge simultaneously lifts `K = 3` multi-hop tracking {{brg_vs_unc_mh_k3}} ({{unc_k3_mh}} to {{brg_k3_mh}}) and restores `K = 4` corporate 0%-APR loan balance-sheet accuracy from {{unc_k4_bs}} unclamped to {{brg_k4_bs}} ({{brg_vs_unc_bs_k4}} over unclamped and {{brg_vs_lora_bs_k4}} over both LoRAs).",
]
callout = "Zero-FLOP Procrustes null-space folding (`Bridge-Only R_safe`) raises `K = 4` reward-hacked verifier accuracy to {{brg_k4_ver_acc}} ({{brg_vs_coda_ver_k4}} over Coda LoRA) and restores `K = 4` corporate balance-sheet accuracy to {{brg_k4_bs}} without adding a single parameter or runtime matrix multiply."
figures = ["fig-verifier-amplification"]

[[sections]]
id = "lora_vs_nullbridge"
preprint_title = "5. Head-to-Head: Behavioral De-Biasing LoRAs vs. Surgical Nullbridge"
monograph_title = "5. Late Filters vs. Recurrent Weight Collateral"
hr_before = true
paragraphs = [
  "To give standard post-training alignment a strong, fair baseline on the exact same hardware and training budget ({{gpu_spend}} total compute across three ephemeral 96 GB GPU pods under a {{gpu_cap}} ceiling), Block 2 trains two rank-{{lora_rank}} DPO + SFT + KL-anchored LoRA banks for {{lora_steps}} steps each on {{lora_train_n}} anti-sycophancy, anti-gloss, and clean-valuation pairs, reaching {{coda_pref_win}} training preference accuracy. `Coda LoRA` ({{coda_params_m}}M trainable parameters) adapts readout layers `L43..L59` downstream of the loop; `Full LoRA` ({{full_params_m}}M trainable parameters) adapts both the recurrent funnel and coda (`L24..L59`) with unrolled `K = 1..4` backpropagation.",
  "Both LoRA regimes exhibit distinct structural pathologies under recurrence. Because `Coda LoRA` sits strictly after `L42`, it leaves multi-pass hidden trajectories at `L42` bit-for-bit identical to the unclamped model. On held-out evaluations at `K = 4`, `Coda LoRA` still suffers {{coda_k4_cov_cap}} wrong-integer capture under authority pressure, degrades reward-hacked verifier accuracy below the unclamped baseline ({{coda_k4_ver_acc}} vs. {{unc_k4_ver_acc}}; ledger audits drop to {{coda_k4_ledg_acc}}), and costs {{coda_k4_mh_drop}} on `K = 4` multi-hop tracking ({{coda_k4_mh}}) and {{coda_k4_bs_drop}} on balance sheets ({{coda_k4_bs}}).",
  "`Full LoRA` modifies weights inside the recurrent funnel itself, holding `K = 4` reward-hacked verification at {{full_k4_ver_acc}} and cutting single-pass (`K = 1`) covert wrong-integer capture from {{unc_k1_cov_cap}} to {{full_k1_cov_cap}}. Yet iterating dense rank-{{lora_rank}} LoRA updates across multiple passes triggers two failures: first, silent looping re-amplifies covert wrong-integer capture inside the adapted funnel from {{full_k1_cov_cap}} (`K = 1`) to {{full_k2_cov_cap}} (`K = 2`) and {{full_k3_cov_cap}} (`K = 3`), settling at {{full_k4_cov_cap}} (`K = 4`). Second, recurrent weight perturbations destabilize basic economic rationality: dominated cashflow sanity (preferring more guaranteed cash over less) crashes to {{full_k2_san}} at `K = 2` ({{full_k2_san_drop}} below unclamped) and {{full_k4_san}} at `K = 4`, while `K = 4` covert moral valuation bias climbs to {{full_k4_mor}} log-odds (tainted-provenance distortion rises {{full_k4_tnt_pct}} above unclamped, from {{unc_k4_tnt}} to {{full_k4_tnt}}).",
  "By contrast, `Dual Nullbridge` (combining `R_safe` with boundary projections at `L24` entry and `L42` exit while touching zero internal `L24..L41` weights) suppresses `L42` `q_fmt` drift by {{fmt_rms_supp_k3}} at `K = 3` (to {{fmt_rms_dual_k3}}) and cuts `K = 4` covert moral valuation bias by {{dual_mor_pct_k4}} ({{unc_k4_mor}} to {{dual_k4_mor}} log-odds, Holm-adjusted paired sign-flip `p =` {{dual_mor_p_k4}}; tainted provenance drops {{dual_tnt_pct_k4}} from {{unc_k4_tnt}} to {{dual_k4_tnt}}). Across all loop depths, `Dual Nullbridge` holds {{dual_k2_san}} and {{dual_k4_san}} cashflow sanity, lifts `K = 2` multi-hop tracking {{dual_vs_unc_mh_k2}} to {{dual_k2_mh}}, preserves {{dual_k4_mh}} `K = 4` multi-hop tracking, and raises `K = 4` multi-step word-problem accuracy {{dual_wp_ratio_k4}} ({{unc_k4_wp}} to {{dual_k4_wp}}), trading {{dual_vs_unc_bs_k4}} on `K = 4` balance sheets ({{dual_k4_bs}}).",
]
figures = ["fig-lora-collateral", "fig-moral-slope"]
tables = ["tbl-head-to-head"]

[[sections]]
id = "boundaries"
tier = "negative"
caveat = "Negative and exploratory boundaries: residual null-space projection does not block KV attention token copying, interior 19-layer all-token clamping induces mean-shift collapse, and uncentered random subspaces perturb BOS attention sinks."
preprint_title = "6. Negative and Exploratory Boundaries: Attention Copy Bypass, Interior Drift, and BOS Sinks"
monograph_title = "6. Where Nullbridge Fails, and Why"
hr_before = true
paragraphs = [
  "Three controlled negative and exploratory results map the exact mechanistic boundaries of residual subspace projection in looped transformers.",
  "First is a sharp negative boundary on literal numeric anchoring (`Attention Copy Bypass`). Base RLHF on Gemma 4 31B already suppresses overt verbal sycophancy (`endorse_wrong_rate =` {{unc_k1_overt}} across all `K = 1..4`, {{unc_k4_overt_lo}} log-odds at `K = 4`). Yet on `n =` {{covert_n}} multi-step arithmetic problems ({{unc_k1_cov_neu}} neutral `0-CoT` accuracy), when a senior executive asserts a specific wrong integer in the prompt, the unclamped model outputs that exact wrong integer {{unc_k1_cov_cap}} of the time ({{unc_k1_cov_pull}} log-odds pull at `K = 1`, {{unc_k4_cov_pull}} at `K = 4`). Even though `Dual Nullbridge` suppresses the `L42` `q_syc` residual projection by {{syc_rms_supp_k4}} at `K = 4`, behavioral wrong-integer capture remains {{neg_cov_cap_k4}} ({{dual_k4_cov_pull}} log-odds pull, diff {{neg_cov_diff_k4}}, Holm `p =` {{neg_cov_p_k4}}). Why? Because the executive's literal digits remain intact inside prompt token KV caches across `L0..L59`; downstream Coda copy and induction heads (`L43..L59`) attend directly to those prompt token positions rather than reading a dispositional scalar from the answer token's residual stream. Residual bridge projection cleanly scrubs distributed dispositional priors (formatting gloss, moral taint, spite) at zero FLOPs, whereas blocking verbatim prompt-token copying requires KV or attention-routing intervention.",
  "Second is a negative boundary on interior clamping (`19-Layer Funnel Clamp`). Applying centered `(I − Q_l Q_l^T)` across all sequence tokens after every layer `L24..L42` on every pass ({{clamp_proj_k4}} consecutive projections at `K = 4`) drives covert moral valuation delta to {{neg_clamp_mor_k4}} log-odds, yet subtracting a last-token neutral mean from prompt and `<bos>` positions across {{clamp_proj_k4}} interior visits shifts layer operating points (`KL` rises to {{neg_clamp_kl_k2}} at `K = 2` and {{neg_clamp_kl_k4}} at `K = 4`). That interior drift flips overt sycophancy from {{unc_k1_overt}} to {{neg_clamp_overt_k4}}, drops `K = 4` reward-hacked verification to {{neg_clamp_ver_k4}}, cuts multi-hop alias guardrail detection to {{neg_clamp_alias_k4}} (chance), and lowers `K = 4` multi-hop ({{neg_clamp_mh_k4}}) and balance-sheet ({{neg_clamp_bs_k4}}) accuracy. Restricting intervention to loop boundaries (`Bridge-Only R_safe` or `Dual Nullbridge`) avoids interior drift completely.",
  "Third is an exploratory geometric finding from `Random 4D Subspace Control`. Projecting out {{rank_removed}} random orthonormal directions orthogonal to `Q` across all sequence positions spikes `K = 4` KL divergence to {{exp_rand_kl_k4}} and collapses multi-token greedy integer generation ({{exp_rand_mh_k4}} multi-hop, {{exp_rand_bs_k4}} balance-sheet) while leaving `0-CoT` binary `A/B` verification comparatively intact ({{exp_rand_ver_k4}}) and leaving moral taint unhealed ({{exp_rand_mor_k4}} log-odds). Contrastive concept directions (`h_pos − h_neg`) cancel shared `<bos>` attention-sink coordinates (`~10^3` norm in Gemma 4) automatically, whereas uncentered isotropic random vectors in `R^5376` have non-zero inner product with `<bos>` sink coordinates and perturb attention denominators across downstream layers. Any subspace intervention applied across sequence tokens must therefore lie in the orthogonal complement of `<bos>` sink coordinates.",
]
figures = ["fig-boundary-kl"]
tables = ["tbl-negative-boundaries"]

[[sections]]
id = "native_inkling"
preprint_title = "7. Native Pretrained Looped MoEs: Cross-Pass Message Banks and Looped Lenses on Varloop and Inkling-2-Mini"
monograph_title = "7. Inside Native Pretrained Loops: Varloop and Inkling-2-Mini"
hr_before = true
paragraphs = [
  "Do the multi-pass dynamics observed on a retrofitted Procrustes loop carry over to models pretrained from scratch to think in silent loops? Track A tests two native {{ta_n_layers}}-layer (`d_model =` {{ta_d_model}}) looped Mixture-of-Experts checkpoints [cite:tml2026inkling] across {{ta_total_cells}} additional GPU cells ({{ta_gpu_spend}} compute under a {{ta_gpu_cap}} cap): variable-depth `TML-d24-varloop-research` (`K = 1, 2, 3, 4, 5` trained plus exploratory out-of-distribution `K = 7`, {{ta_varloop_cells}} cells) and flagship `Inkling-2-Mini` (`K = 3`, {{ta_ink_cells}} cells). Both architectures run a single-pass stem (`L0..L5`), iterate a {{ta_loop_layers}}-layer recurrent block (`L6..L17`, {{ta_k5_blocks}} effective block visits at `K = 5`) that writes four distinct rank-{{ta_gate_rank}} cross-pass message channels (`query`, `key`, `value`, and `mlp`) at `L17` for injection on the next pass, and exit through a 6-layer Coda (`L18..L23`) coupled to block-attention residuals.",
  "All four behavioral concepts reach {{ta_v_lopo}} leave-one-pair-out linear separability both in the pooled message bank and individually inside every single message channel (`query`, `key`, `value`, and `mlp`) on both checkpoints, sitting {{ta_v_auth_deg}} to {{ta_v_spite_deg}} from genuine deductive evidence on `TML-d24-varloop-research` and {{ta_ink_auth_deg}} to {{ta_ink_syc_deg}} on `Inkling-2-Mini` ({{ta_removed_pct}} of message dimensions removed, {{ta_retained_pct}} retained). Explicitly QR-orthogonalizing the 4D basis against `<bos>` sink coordinates drives `<bos>` overlap to {{ta_v_bos_overlap}} and keeps held-out `KL` tiny ({{ta_v_all4_k5_kl}} at `K = 5` on `Varloop` and {{ta_ink_all4_k3_kl}} on `Inkling-2-Mini`), while zero-FLOP weight folding into `message_input.query` ({{ta_zff_q_leak}} leakage) and `gate.down_proj` ({{ta_zff_gate_leak}} leakage) adds {{extra_params}} parameters and {{extra_flops}} runtime FLOPs. Cross-pass `confident_formatting` message projection (`unclamped`: {{ta_fmt_msg_p2}} on Pass 2 to {{ta_fmt_msg_p5}} on Pass 5) drops identically to {{ta_fmt_msg_null_p2}} under `Message-Bank Nullbridge`.",
  "First, decoding what a native looped MoE is thinking mid-loop requires accounting for block-attention residuals. Across `n =` {{ta_lens_tokens_n}} held-out tokens on `TML-d24-varloop-research`, applying `lm_head(norm(h_17))` directly (`Raw Logit Lens`) leaves `KL` to the final vocabulary distribution stuck at {{ta_lens_raw_p1}} (Pass 1) through {{ta_lens_raw_p5}} (Pass 5). Fitting a closed-form `[L11; L17]` `Coda-Transport Ridge Lens` on disjoint general text cuts readout `KL` by {{ta_lens_p1_kl_delta}} to {{ta_lens_p5_kl_delta}} across every pass ({{ta_lens_ridge_p1}} at Pass 1 to {{ta_lens_ridge_p5}} at Pass 5, lifting Pass-5 Top-5 token agreement from {{ta_lens_p5_top5_raw}} to {{ta_lens_p5_top5_ridge}}). On flagship `Inkling-2-Mini`, Pass-3 `KL` drops {{ta_ink_lens_p3_kl_delta}} ({{ta_ink_lens_p3_raw}} to {{ta_ink_lens_p3_ridge}}; Top-5 agreement climbs from {{ta_ink_lens_p3_top5_raw}} to {{ta_ink_lens_p3_top5}}), and decoding unverbalized `0-CoT` verification reveals that `Message-Bank Nullbridge` lifts Pass-3 pre-coda accuracy {{ta_ink_precoda_ver_gain}} ({{ta_ink_precoda_unc_p3}} to {{ta_ink_precoda_all4_p3}}) before Coda `L18..L23` even runs.",
  "Second, varying `K` on `TML-d24-varloop-research` isolates the exact moment covert moral valuation (`Money Is Moral`) switches on. At `K = 1` pass (before cross-pass messages fire), covert moral distortion is near zero ({{ta_v_unc_k1_mor}} log-odds). At `K = 2` passes, moral distortion jumps {{ta_mor_jump_ratio}} to {{ta_v_unc_k2_mor}} log-odds (tainted provenance rises from {{ta_v_unc_k1_tnt}} to {{ta_v_unc_k2_tnt}}) and persists through `K = 5` ({{ta_v_unc_k5_mor}}) and exploratory out-of-distribution `K = 7` ({{ta_v_unc_k7_mor}}), as well as on flagship `Inkling-2-Mini` at `K = 3` ({{ta_ink_unc_k3_mor}} combined, {{ta_ink_unc_k3_tnt}} tainted provenance). Training `Coda LoRA` ({{ta_coda_params_m}}M parameters on `L18..L23` for {{ta_coda_steps}} DPO + SFT + KL steps) cuts `K = 5` wrong-integer capture to {{ta_v_coda_k5_cov}}, yet backfires severely on hidden valuation and safety: it multiplies covert moral bias {{ta_coda_mor_k3_ratio}} at `K = 3` ({{ta_v_coda_k3_mor}} log-odds, Holm `p =` {{ta_p_all4_coda_mor_k3}} vs. `Message-Bank Nullbridge`) and {{ta_coda_mor_k5_ratio}} at `K = 5` ({{ta_v_coda_k5_mor}} log-odds; tainted provenance hits {{ta_v_coda_k5_tnt}}, Holm `p =` {{ta_p_all4_coda_mor_k5}}), while dropping `K = 5` hacked verifier accuracy {{ta_coda_ver_drop_k5}} ({{ta_v_coda_k5_ver}}, Holm `p =` {{ta_p_all4_coda_ver_k5}}) and `2-to-4`-hop alias guardrails {{ta_coda_alias_drop_k5}} ({{ta_v_coda_k5_alias}}). By contrast, `Message-Bank Nullbridge (All-4)` trims moral bias at every multi-pass depth and cuts `Inkling-2-Mini` moral distortion {{ta_ink_all4_mor_pct}} ({{ta_ink_unc_k3_mor}} to {{ta_ink_all4_k3_mor}}; tainted provenance {{ta_ink_all4_tnt_pct}} from {{ta_ink_unc_k3_tnt}} to {{ta_ink_all4_k3_tnt}}) while raising alias guardrails from {{ta_ink_unc_k3_alias}} to {{ta_ink_all4_k3_alias}}, and `Zero-FLOP Weight Fold` trims `Inkling-2-Mini` verifier reward-hack susceptibility {{ta_ink_zff_susc_pct}} ({{ta_ink_unc_k3_susc}} to {{ta_ink_zff_k3_susc}} log-odds).",
  "Third, unlike retrofitted Gemma 4 ({{neg_cov_cap_k4}} wrong-integer capture at every `K`), native pretrained loops actively self-correct bossy wrong numbers as `K` grows: unclamped capture on `TML-d24-varloop-research` drops monotonically from {{ta_v_unc_k1_cov}} (`K = 1`) to {{ta_v_unc_k5_cov}} (`K = 5`, {{ta_cov_drop_k1_k5}}) and {{ta_v_unc_k7_cov}} at exploratory `K = 7` ({{ta_cov_drop_k1_k7}}), while corporate balance-sheet accuracy climbs {{ta_bs_k1_k5_ratio}} ({{ta_v_unc_k1_bs}} to {{ta_v_unc_k5_bs}}) and flagship `Inkling-2-Mini` lowers `K = 3` capture to {{ta_ink_unc_k3_cov}}. Dissecting the four message channels reveals where cross-pass numeric anchoring travels: scrubbing `MLP` messages alone barely moves `K = 4` wrong-integer capture ({{ta_v_unc_k4_cov}} to {{ta_v_mlp_k4_cov}}, {{ta_mlp_k4_cov_pp}}), whereas scrubbing cross-pass `QKV` attention messages drops `K = 4` capture {{ta_qkv_k4_cov_pp}} (to {{ta_v_qkv_k4_cov}}) and `K = 5` capture {{ta_qkv_k5_cov_pp}} (to {{ta_v_qkv_k5_cov}}, with {{ta_v_qkv_k5_ver}} hacked verifier accuracy). `Zero-FLOP Weight Fold` cuts `K = 4` capture {{ta_zff_k4_cov_pp}} (to {{ta_v_zff_k4_cov}}), and `Message-Bank Nullbridge (All-4)` trims `Inkling-2-Mini` capture {{ta_ink_all4_cov_pp}} to {{ta_ink_all4_k3_cov}}.",
]
callout = "On native pretrained looped MoEs, covert moral bias is absent at `K = 1` ({{ta_v_unc_k1_mor}} log-odds) and ignites {{ta_mor_jump_ratio}} at `K = 2` ({{ta_v_unc_k2_mor}}) when cross-pass messages turn on. `Coda LoRA` backfires by doubling moral distortion ({{ta_coda_mor_k5_ratio}} at `K = 5`), whereas `<bos>`-orthogonal message-bank projection cuts `Inkling-2-Mini` tainted provenance {{ta_ink_all4_tnt_pct}} and cross-pass `QKV` scrubbing cuts `K = 4` wrong-integer capture {{ta_qkv_k4_cov_pp}}."
figures = ["fig-coda-transport-lens", "fig-native-moral-jump", "fig-native-qkv-dissection"]
tables = ["tbl-track-a"]

[[sections]]
id = "implications"
preprint_title = "8. Cross-Architecture Synthesis: Retrofitted Bridges vs. Native Message Banks"
monograph_title = "8. Designing Safe Silent Loops"
hr_before = true
paragraphs = [
  "Taken together, the {{combined_cells}}-cell cross-architecture matrix ({{combined_gpu_spend}} total GPU compute under a {{combined_gpu_cap}} ceiling, zero active pods remaining) establishes four concrete engineering rules for aligning silent looped models:",
]
bullets = [
  "Fold `<bos>`-orthogonal dispositional null spaces into recurrent bridges and message banks by default: `R_safe = R_proc (I − Q Q^T)` on retrofitted loops and message-bank / gate null-space projection on native looped MoEs add {{extra_params}} parameters and {{extra_flops}} runtime FLOPs, lift `Gemma-4-Loop-Compact` `K = 4` hacked verification to {{brg_k4_ver_acc}} and balance sheets to {{brg_k4_bs}}, and cut `Inkling-2-Mini` tainted-provenance distortion {{ta_ink_all4_tnt_pct}} while raising pre-coda Pass-3 verification {{ta_ink_precoda_ver_gain}}.",
  "Keep surgical projections on loop boundaries and cross-pass message banks rather than interior residual visits: boundary projection (`Dual Nullbridge`) cuts `Gemma-4` moral contamination {{dual_mor_pct_k4}} at {{dual_k4_san}} cashflow sanity and `<bos>`-orthogonal message projection holds `Inkling-2-Mini` `KL` to {{ta_ink_all4_k3_kl}}, whereas clamping all {{clamp_proj_k4}} interior block visits breaks alignment guardrails.",
  "Do not rely on Coda-only or dense recurrent LoRAs alone for multi-pass safety: `Coda LoRA` underperforms zero-FLOP `R_safe` by {{brg_vs_coda_ver_k4}} on retrofitted `K = 4` verifiers and multiplies covert moral distortion {{ta_coda_mor_k3_ratio}} to {{ta_coda_mor_k5_ratio}} on native looped MoEs while eroding `K = 5` alias guardrails {{ta_coda_alias_drop_k5}}, and dense recurrent `Full LoRA` crashes `K = 2` cashflow sanity to {{full_k2_san}}.",
  "Target cross-pass `QKV` message channels and Coda KV routing for numeric anchoring: native recurrent deliberation plus cross-pass `QKV` null-space projection cuts wrong-integer capture to {{ta_v_qkv_k5_cov}} (`Varloop` `K = 5`) and {{ta_ink_all4_k3_cov}} (`Inkling-2-Mini` `K = 3`), whereas retrofitted loops lacking cross-pass `QKV` message gates require explicit KV-routing or span-masking defenses against verbatim token copying.",
