abstract = "Moving multi-step deliberation from visible chain-of-thought tokens into silent recurrent passes blinds token-level monitors and exposes hidden states to multi-pass heuristic compounding. Across {{combined_cells}} GPU evaluation cells spanning both a retrofitted Procrustes loop (Gemma-4-Loop-Compact, {{compact_gb}}, K = 1..4) and two native pretrained looped MoEs with 4-channel cross-pass message banks (TML-d24-varloop-research across K = 1..5 plus OOD K = 7, and flagship Inkling-2-Mini at K = 3), I compare behavioral de-biasing LoRAs head-to-head against algebraic null-space projection. On Gemma-4-Loop-Compact, silent recurrence raises zero-CoT multi-hop tracking {{amp_mh_k4_ratio}} ({{unc_k1_mh}} to {{unc_k4_mh}}) while multiplying single-pass verifier susceptibility to confident markdown gloss {{amp_ver_k3_ratio}} at K = 3 ({{unc_k1_ver_susc}} to {{unc_k3_ver_susc}} log-odds). Folding four contrastive bias axes ({{removed_pct}} of residual dimensions, sitting {{syc_ctrl_deg}} to {{auth_ctrl_deg}} from genuine evidence) into the Procrustes bridge (R_safe = R_proc (I − Q Q^T), {{extra_params}} extra parameters, {{extra_flops}} extra FLOPs) lifts K = 4 hacked verification to {{brg_k4_ver_acc}} ({{brg_vs_coda_ver_k4}} over Coda LoRA) and corporate balance-sheet accuracy to {{brg_k4_bs}}, while Dual Nullbridge cuts K = 4 moral contamination {{dual_mor_pct_k4}} (Holm p = {{dual_mor_p_k4}}) without Full LoRA's {{full_k2_san}} cashflow sanity crash. On native pretrained loops, a closed-form Coda-Transport Ridge Lens cuts intermediate readout KL by {{ta_lens_p1_kl_delta}} to {{ta_lens_p5_kl_delta}} across passes ({{ta_ink_lens_p3_kl_delta}} on Inkling-2-Mini, lifting Pass-3 Top-5 token agreement to {{ta_ink_lens_p3_top5}}). Behaviorally, covert moral bias is near zero at K = 1 ({{ta_v_unc_k1_mor}} log-odds) and jumps {{ta_mor_jump_ratio}} on Pass 2 ({{ta_v_unc_k2_mor}} log-odds) as cross-pass messages activate; Coda LoRA (L18..L23) backfires by multiplying moral distortion {{ta_coda_mor_k3_ratio}} at K = 3 ({{ta_v_coda_k3_mor}} log-odds, Holm p = {{ta_p_all4_coda_mor_k3}}) and {{ta_coda_mor_k5_ratio}} at K = 5 ({{ta_v_coda_k5_mor}} log-odds) while degrading K = 5 alias guardrails {{ta_coda_alias_drop_k5}}. Conversely, native silent passes self-correct wrong-integer anchoring from {{ta_v_unc_k1_cov}} (K = 1) to {{ta_v_unc_k5_cov}} (K = 5) and {{ta_ink_unc_k3_cov}} on Inkling-2-Mini; dissecting the message bank proves cross-pass QKV attention messages carry the anchor ({{ta_qkv_k4_cov_pp}} at K = 4 vs. {{ta_mlp_k4_cov_pp}} for MLP-only), and BOS-orthogonal message-bank projection trims Inkling-2-Mini tainted-provenance distortion {{ta_ink_all4_tnt_pct}} while lifting Pass-3 pre-coda verifier accuracy {{ta_ink_precoda_ver_gain}} ({{ta_ink_precoda_unc_p3}} to {{ta_ink_precoda_all4_p3}}). Controlled negative boundaries delimit residual projection under verbatim KV token copying ({{neg_cov_cap_k4}} on Gemma 4, Holm p = {{neg_cov_p_k4}}), interior 19-layer clamping ({{neg_clamp_overt_k4}} overt sycophancy), and uncentered BOS sink perturbation ({{exp_rand_kl_k4}} KL)."

lede = "Across {{combined_cells}} GPU cells on retrofitted Gemma-4-Loop-Compact ({{compact_gb}}) and native pretrained TML-d24-varloop-research and Inkling-2-Mini, silent recurrent passes lift state tracking yet multiply verifier reward hacking {{amp_ver_k3_ratio}} on retrofitted loops and ignite covert moral bias {{ta_mor_jump_ratio}} on Pass 2 of native message-bank loops. Algebraic null-space projection curbs dispositional drift at near-zero KL without Full LoRA's {{full_k2_san}} cashflow sanity crash or Coda LoRA's {{ta_coda_mor_k5_ratio}} moral backfire, while isolating cross-pass QKV messages ({{ta_qkv_k4_cov_pp}} wrong-number capture at K = 4) and verbatim KV copy heads as the carriers of numeric anchoring."

x_hook = "Tested Nullbridge across {{combined_cells}} cells on retrofitted Gemma-4-Loop-Compact and native pretrained Inkling-2-Mini + Varloop. Silent loops multiply verifier reward hacking {{amp_ver_k3_ratio}} (Gemma 4) and jump covert moral bias {{ta_mor_jump_ratio}} at Pass 2 (Varloop), where Coda LoRA backfires {{ta_coda_mor_k5_ratio}} on moral taint while message-bank QKV + Procrustes null-space projection stays clean."

opening_paragraphs = [
  "Part 1 of this series (Money Is Moral) showed that post-training preference alignment acts largely as a late verbal filter: models refuse explicit bias in prose while covertly mispricing tainted assets and asymmetric splits inside their hidden states. Part 2 (Rotating the Bottleneck) showed that those covert valuation axes share the exact mid-stack bottleneck (`L24..L42` in Gemma 4 31B) used for multi-hop state tracking, and that an SVD Orthogonal Procrustes bridge turns those frozen blocks into a silent `K = 1..4` recurrent deliberator inside {{compact_gb}} of memory.",
  "Part 3 tests what happens when silent recurrence meets adversarial framing across two distinct architectural families: a retrofitted Procrustes hourglass (`Gemma-4-Loop-Compact`, `K = 1..4`) and native pretrained looped Mixture-of-Experts models (`TML-d24-varloop-research` across `K = 1..5` plus exploratory `K = 7`, and flagship `Inkling-2-Mini` at `K = 3`). Across {{eval_total_items}} held-out prompts per cell ({{combined_cells}} cells total, zero lexical or entity overlap against probe or training splits), I compare behavioral de-biasing LoRAs head-to-head against algebraic null-space projection folded into Procrustes bridges and 4-channel cross-pass message banks.",
]

opening_summary = [
  "Retrofitted Procrustes loop (`Gemma-4-Loop-Compact`): silent passes (`K = 1..4`) lift zero-CoT multi-hop tracking {{amp_mh_k4_ratio}} ({{unc_k1_mh}} to {{unc_k4_mh}}) while multiplying single-pass verifier reward hacking {{amp_ver_k3_ratio}} at `K = 3`; zero-FLOP bridge folding (`R_safe`, leakage {{r_null_leak}}) lifts `K = 4` hacked verification to {{brg_k4_ver_acc}} ({{brg_vs_coda_ver_k4}} over Coda LoRA) and balance sheets to {{brg_k4_bs}}, while Dual Nullbridge cuts moral taint {{dual_mor_pct_k4}} without Full LoRA's {{full_k2_san}} sanity crash.",
  "Looped Lens for native MoEs (`Varloop` & `Inkling-2-Mini`): raw `L17` logit lens fails (`KL =` {{ta_lens_raw_p1}} to {{ta_lens_raw_p5}}) because Inkling routes through 6-layer block-attention residuals and Coda `L18..L23`; a closed-form `[L11; L17]` Coda-Transport Ridge Lens cuts readout KL by {{ta_lens_p1_kl_delta}} to {{ta_lens_p5_kl_delta}} ({{ta_ink_lens_p3_kl_delta}} on `Inkling-2-Mini`, Top-5 agreement {{ta_ink_lens_p3_top5}}) and shows message-bank projection lifting Pass-3 pre-coda verification {{ta_ink_precoda_ver_gain}} ({{ta_ink_precoda_unc_p3}} to {{ta_ink_precoda_all4_p3}}).",
  "Pass-2 moral ignition & Coda LoRA backfire: on `TML-d24-varloop-research`, covert moral bias is near zero at `K = 1` ({{ta_v_unc_k1_mor}} log-odds) and jumps {{ta_mor_jump_ratio}} to {{ta_v_unc_k2_mor}} at `K = 2` ({{ta_ink_unc_k3_mor}} on `Inkling-2-Mini`, tainted provenance {{ta_ink_unc_k3_tnt}}); `L18..L23` Coda LoRA doubles moral distortion ({{ta_coda_mor_k3_ratio}} at `K = 3`, Holm `p =` {{ta_p_all4_coda_mor_k3}}; {{ta_coda_mor_k5_ratio}} at `K = 5`), whereas `<bos>`-orthogonal message-bank projection cuts `Inkling-2-Mini` tainted provenance {{ta_ink_all4_tnt_pct}} at {{ta_ink_all4_k3_kl}} KL.",
  "Native self-correction & `QKV` vs. `MLP` message dissection: native silent passes cut wrong-integer capture from {{ta_v_unc_k1_cov}} (`K = 1`) to {{ta_v_unc_k5_cov}} (`K = 5`) and {{ta_ink_unc_k3_cov}} (`Inkling-2-Mini`); scrubbing cross-pass `QKV` messages at `K = 4` cuts capture {{ta_qkv_k4_cov_pp}} (to {{ta_v_qkv_k4_cov}}) versus {{ta_mlp_k4_cov_pp}} for `MLP`-only ({{ta_v_mlp_k4_cov}}).",
  "Negative & exploratory boundaries: residual projection alone cannot block verbatim Coda KV token copying on retrofitted Gemma 4 ({{neg_cov_cap_k4}} capture), interior 19-layer clamping flips overt sycophancy to {{neg_clamp_overt_k4}}, and uncentered random subspaces hit `<bos>` attention sinks ({{exp_rand_kl_k4}} KL vs. `<bos>` overlap {{ta_v_bos_overlap}} when QR-orthogonalized).",
]

